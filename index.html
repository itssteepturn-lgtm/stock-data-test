<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>盘面</title>
<style>
  :root{--bg:#0d1117;--panel:#151b23;--line:#232b36;--text:#e6e9ef;--dim:#8891a0;--up:#e5484d;--down:#2ea567;--accent:#4a90e2;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;height:100%;overscroll-behavior-y:none;}
  #app{max-width:760px;margin:0 auto;padding:12px 12px 80px;}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 12px;}
  header h1{font-size:18px;font-weight:700;margin:0;}
  #top-info{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;position:relative;overflow:hidden;}
  .card.updating::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);animation:shimmer 1.2s infinite;}
  @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .idx-row{display:flex;align-items:center;gap:10px;}
  .idx-name{width:66px;flex-shrink:0;}
  .idx-name .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .idx-name .c{font-size:10px;color:var(--dim);}
  .idx-chart{flex:1;height:42px;}
  .idx-price{width:108px;text-align:right;flex-shrink:0;}
  .idx-price .p{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  .idx-price .pct{font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--dim);}
  .section-label{font-size:11px;color:var(--dim);margin:20px 2px 8px;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center;}
  .pill{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--dim);cursor:pointer;}
  .pill.active{color:var(--text);border-color:var(--accent);background:rgba(74,144,226,.12);}
  #detail{position:fixed;inset:0;background:var(--bg);transform:translateY(100%);transition:transform .28s ease;z-index:20;overflow-y:auto;}
  #detail.open{transform:translateY(0);}
  #detail-inner{max-width:760px;margin:0 auto;padding:12px 12px 20px;}
  .detail-head{display:flex;align-items:center;gap:10px;padding:6px 2px 8px;position:sticky;top:0;background:var(--bg);z-index:2;}
  .back{font-size:22px;padding:2px 8px 2px 0;}
  .detail-head .title{font-size:15px;font-weight:600;flex:1;}
  .detail-kv{display:flex;gap:12px;font-size:11px;color:var(--dim);flex-wrap:wrap;margin:4px 0 6px;}
  .detail-kv b{color:var(--text);font-weight:600;}
  canvas.chart{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:block;margin-bottom:6px;}
  canvas.chart.main{height:260px;}
  canvas.chart.zq{height:105px;}
  canvas.chart.vol{height:52px;}
  canvas.chart.macd{height:52px;}
  canvas.chart.mini{height:42px;background:transparent;border:none;}
  .value-tags{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--dim);margin:2px 0 6px;}
  .value-tags span{border:1px solid var(--line);border-radius:6px;padding:2px 6px;}
  .hint{font-size:11px;color:var(--dim);text-align:center;padding:10px 0;}
  .cond-row{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:12px;}
  .cond-row label.lbl{width:70px;color:var(--dim);flex-shrink:0;}
  .cond-row select,.cond-row input[type=number],.cond-row input[type=date]{flex:1;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;min-width:0;}
  .btn{font-size:12px;padding:6px 14px;border-radius:8px;background:var(--accent);color:#fff;display:inline-block;cursor:pointer;text-align:center;}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--text);}
  .btn.danger{background:var(--up);}
  .btn.off{opacity:.45;pointer-events:none;}
  #sel-results .res-card{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel);margin-bottom:8px;}
  .cat-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;}
  .cat-bar .pill{white-space:nowrap;}
  /* 选股面板 */
  .tabs{display:flex;gap:6px;margin:6px 0 8px;}
  .tab{flex:1;text-align:center;font-size:13px;padding:7px 0;border-radius:8px;border:1px solid var(--line);color:var(--dim);cursor:pointer;}
  .tab.active{color:var(--text);border-color:var(--accent);background:rgba(74,144,226,.12);}
  .tab .bd{display:inline-block;min-width:16px;padding:0 5px;margin-left:6px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;line-height:16px;}
  .blk{border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:6px;background:#10161d;}
  .blk.on{border-color:var(--accent);}
  .blk-h{font-size:12px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .blk-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:5px;}
  .blk select,.blk input{background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;}
  .blk input[type=number]{width:64px;}
  .sum-line{font-size:11px;color:var(--dim);line-height:1.6;margin:4px 0 8px;word-break:break-all;}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
  .chip{font-size:10px;padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--dim);cursor:pointer;}
  .tbl{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums;}
  .tbl td,.tbl th{padding:4px 4px;border-bottom:1px solid var(--line);text-align:right;}
  .tbl th{color:var(--dim);font-weight:400;position:sticky;top:0;background:var(--panel);}
  .tbl td:first-child,.tbl th:first-child{text-align:left;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px;}
  .stat{background:#10161d;border:1px solid var(--line);border-radius:8px;padding:6px 8px;}
  .stat .k{font-size:10px;color:var(--dim);} .stat .v{font-size:15px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;}
  .dist-row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim);margin:2px 0;}
  .dist-row .bar{height:8px;border-radius:3px;min-width:1px;}
  .hit-nav{display:none;align-items:center;gap:8px;font-size:12px;margin:2px 0 6px;}
  .hit-nav .btn{padding:3px 12px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>盘面</h1>
    <div id="top-info">载入中…</div>
  </header>

  <div class="section-label"><span>指数</span></div>
  <div id="idx-list"></div>

  <div class="section-label"><span>自选股 <span id="wl-count" style="color:var(--dim);"></span></span><span id="edit-toggle" class="pill">编辑</span></div>
  <div class="cat-bar" id="cat-bar"></div>
  <div id="watch-list"></div>
  <div class="card" style="display:flex;gap:8px;align-items:center;">
    <input id="add-code" type="tel" inputmode="numeric" placeholder="6位代码，加到当前分类，最新的在最前" style="flex:1;background:transparent;border:none;color:var(--text);font-size:13px;outline:none;">
    <input id="add-cat" type="text" placeholder="分类" style="width:70px;background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;color:var(--text);">
    <div id="add-btn" class="btn" style="padding:5px 12px;">添加</div>
  </div>
  <div id="add-msg" class="hint" style="display:none;"></div>

  <div class="section-label" style="margin-top:26px;"><span>选股 · 回测</span><span id="sel-load" style="font-size:10px;">数据载入中…</span></div>
  <div class="card" id="sel-card" style="font-size:12px;">
    <div class="cond-row"><label class="lbl">日期</label><input id="sel-date-from" type="date"><span style="color:var(--dim);">至</span><input id="sel-date-to" type="date"></div>
    <div class="hint" id="sel-date-hint" style="padding:0 0 4px;text-align:left;">都留空＝只看最后一根K线；只填“起”＝只看那一天；两个都填＝区间内每一天。回测不受这里影响，总是测手里全部数据</div>
    <div class="tabs" id="sel-tabs"></div>
    <div id="sel-panes"></div>
    <div id="sel-summary" class="sum-line"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <div id="run-sel-btn" class="btn off">开始选股</div>
      <div id="run-backtest-btn" class="btn ghost off">回测（全部历史·尾盘买次日收盘卖）</div>
      <div id="reset-sel-btn" class="btn ghost">清空条件</div>
    </div>
    <div id="sel-progress" class="hint"></div>
  </div>
  <div id="sel-results"></div>
  <div id="backtest-results"></div>

  <div id="detail">
    <div id="detail-inner">
      <div class="detail-head"><div class="back" id="detail-back">‹</div><div class="title" id="detail-title">--</div></div>
      <div id="hit-nav" class="hit-nav"><div class="btn ghost" id="hit-prev">‹</div><div id="hit-label" style="flex:1;text-align:center;"></div><div class="btn ghost" id="hit-next">›</div></div>
      <div id="detail-meta" class="hint" style="text-align:left;padding:2px 0 4px;"></div>
      <div id="detail-price" class="detail-kv"></div>
      <div id="detail-cost" class="value-tags"></div>
      <canvas id="chart-main" class="chart main"></canvas>
      <canvas id="chart-sub" class="chart zq"></canvas>
      <canvas id="chart-vol" class="chart vol"></canvas>
      <canvas id="chart-macd" class="chart macd"></canvas>
      <div id="detail-zq" class="value-tags"></div>
      <div class="hint" id="detail-hint">点击K线显示光标和当日数据，再点取消</div>
    </div>
  </div>
</div>

<script>
const DATA_REPO='itssteepturn-lgtm/stock-data-test';
const DATA_BRANCH='gh-pages';
const TEST_CODES=['300642','300740','002579','002584','003001','301086','600880','002708','600127','600088','688175','301390','603248','688004'];
const TEST_INDEXES=[
  {code:'1.000001',name:'上证指数',short:'000001',type:'index'},
  {code:'0.399001',name:'深证成指',short:'399001',type:'index'},
  {code:'0.399006',name:'创业板指',short:'399006',type:'index'},
];
let VER=null;          // data/screen/meta.json 的版本号：每次后台更新数据后才变，让浏览器可以缓存
let CAL=[];            // 交易日历（最近≤150个交易日）
let NAMES={};          // 代码 -> 名称
let SCREEN_META=null;

function codeToSecid(code){
  if(/^(6|9)/.test(code)) return '1.'+code;
  if(/^(0|2|3)/.test(code)) return '0.'+code;
  if(/^(4|8)/.test(code)) return '0.'+code;
  return null;
}
function dispName(item){ if(item.type==='index') return item.name; /* 指数代码 000001 和个股 000001(平安银行) 重名，指数必须用自己的名字 */ return NAMES[item.short]||item.name||item.short; }

// 只读自己仓库的静态数据：先同源(GitHub Pages)，失败再退到 raw.githubusercontent；不再用会缓存旧数据的 CDN
async function fetchJSON(path, timeoutMs=15000){
  const q=VER?('?v='+VER):('?t='+Date.now());
  const urls=[`./${path}${q}`,`https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/${path}${q}`];
  let lastErr=new Error('fetch fail');
  for(const url of urls){
    const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),timeoutMs);
    try{
      const r=await fetch(url,{cache:VER?'default':'no-store',signal:ctrl.signal});
      if(!r.ok) throw new Error('http '+r.status);
      const j=await r.json(); clearTimeout(tm); return j;
    }catch(e){ clearTimeout(tm); lastErr=e; }
  }
  throw lastErr;
}

async function loadScreenMeta(){
  try{
    const m=await fetchJSON('data/screen/meta.json',8000);
    if(m && Array.isArray(m.dates) && m.dates.length && Array.isArray(m.shards)){
      SCREEN_META=m; VER=m.version||null; CAL=m.dates.slice(); NAMES=m.names||{};
      return m;
    }
  }catch(e){}
  try{
    const cal=await fetchJSON('data/trading_calendar.json',5000);
    if(Array.isArray(cal)&&cal.length>=20) CAL=cal.slice(-150);
  }catch(e){}
  return null;
}
async function showTopInfo(){
  const el=document.getElementById('top-info');
  if(SCREEN_META){ el.textContent=`${SCREEN_META.count} 只股票 · 最新K线 ${SCREEN_META.last}`; return; }
  try{
    const m=await fetchJSON('data/meta.json',5000);
    el.textContent=`${m.existing||m.updated||0} 只股票 · 最新K线 ${m.lastUpdateDate||'--'}`;
  }catch(e){ el.textContent='未找到数据'; }
}

async function getFullHistory(secid){
  const code=secid.split('.')[1];
  const isIndex=TEST_INDEXES.some(x=>x.code===secid); // 必须用完整secid判断：1.000001是上证指数，0.000001是平安银行
  const j=await fetchJSON(isIndex?`data/indices/${code}.json`:`data/stocks/${code}.json`,8000);
  const raw=j.bars||j;
  if(!raw||raw.length<1) throw new Error('后台无 '+code);
  const bars=Array.isArray(raw)?raw:(raw.bars||[]);
  return bars.slice(-150).map(b=>({
    date:b.date,open:b.open,close:b.close,high:b.high,low:b.low,vol:b.vol||0,amount:b.amount||0,turnover:b.turnover||0,
    avg:b.avg||(b.amount&&b.vol?b.amount/(b.vol*100):b.close),
    cost50:b.cost50,cost75:b.cost75,cost90:b.cost90,zq1:b.zq1,zq:b.zq,vwma10:b.vwma10
  }));
}

const histCache={}, histInflight={};
async function getHistBars(secid, limit){
  if(!histCache[secid]){
    if(!histInflight[secid]){
      histInflight[secid]=getFullHistory(secid).then(b=>{histCache[secid]=b;delete histInflight[secid];return b;}).catch(e=>{delete histInflight[secid];throw e;});
    }
    await histInflight[secid];
  }
  return histCache[secid].slice(-Math.min(limit,150));
}


// ---- 绘制（以下 calcMACD / drawMain / drawMiniK / drawVOL / drawZQ / drawMACD 为原样保留，仅 drawMain 里去掉了 _live 判断）----
function calcMACD(closes){
  const ema=(arr,period)=>{
    const k=2/(period+1); let e=[]; let prev=arr[0];
    for(let i=0;i<arr.length;i++){ const v=arr[i]; prev=i===0?v:v*k+prev*(1-k); e.push(prev);} return e;
  };
  const ema12=ema(closes,12), ema26=ema(closes,26);
  const dif=closes.map((_,i)=>ema12[i]-ema26[i]);
  const dea=ema(dif,9);
  const macd=dif.map((d,i)=>(d-dea[i])*2);
  return {dif,dea,macd};
}
// ---- 绘制 ----
// cost颜色：以前 50绿色 75黄色 90红色，都是实线
const COST_COLORS={50:'#2ea567',75:'#e0b23c',90:'#e5484d'};

function drawMain(canvas, bars, costLines, highlightIdx, isIndex=false){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!bars||!bars.length) return;
  const valid=bars.filter(b=>b);
  if(!valid.length) return;
  const highs=valid.map(b=>b.high), lows=valid.map(b=>b.low);
  let minL=Math.min(...lows), maxH=Math.max(...highs); let pad=(maxH-minL)*0.08||1;
  let minY=minL-pad, maxY=maxH+pad; let range=maxY-minY||1;
  const y=v=>h-((v-minY)/range)*h;
  const n=bars.length;
  const rightPad=10;
  const plotW=w-rightPad;
  const x=i=> (n===1?plotW/2 : i/(n-1)*plotW);
  const bw=Math.max(2, plotW/n*0.6);

  // cost 实线，支持对齐后null
  if(!isIndex && costLines){
    const order=[50,75,90];
    costLines.forEach((line,li)=>{
      if(!line) return;
      const key=order[li];
      ctx.strokeStyle=COST_COLORS[key]||'#888'; ctx.lineWidth=1; ctx.setLineDash([]);
      ctx.beginPath(); let st=false;
      line.forEach((v,i)=>{
        if(v==null || bars[i]==null) { st=false; return; }
        const xx=x(i); 
        if(!st){ctx.moveTo(xx,y(v));st=true;} else ctx.lineTo(xx,y(v));
      }); ctx.stroke();
    });
  }

  bars.forEach((b,i)=>{
    if(!b) return;
    const xx=x(i); const oY=y(b.open), cY=y(b.close), hY=y(b.high), lY=y(b.low);
    const up=b.close>=b.open;
    ctx.strokeStyle=up?'#e5484d':'#2ea567'; ctx.fillStyle=up?'#e5484d':'#2ea567';
    ctx.beginPath(); ctx.moveTo(xx,hY); ctx.lineTo(xx,lY); ctx.stroke();
    const bodyH=Math.max(1, Math.abs(cY-oY));
    ctx.fillRect(xx-bw/2, Math.min(oY,cY), bw, bodyH||1);
  });

  const last=valid[valid.length-1];
  if(last){
    const prev=valid.length>=2?valid[valid.length-2]:null;
    const pct=prev? (last.close-prev.close)/prev.close*100:0;
    const col=pct>=0?'#e5484d':'#2ea567';
    ctx.fillStyle=col; ctx.font='11px sans-serif';
    ctx.fillText(`${last.close.toFixed(2)} ${pct>=0?'+':''}${pct.toFixed(2)}%`, 6, 14);
  }

  if(highlightIdx!=null){
    const xx=x(highlightIdx); ctx.strokeStyle='#e6e9ef'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,h); ctx.stroke(); ctx.setLineDash([]);
  }
}

function drawMiniK(canvas, bars){
  const dpr=window.devicePixelRatio||1; const cssW=canvas.clientWidth||80, cssH=canvas.clientHeight||42; canvas.width=cssW*dpr; canvas.height=cssH*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,cssW,cssH);
  if(!bars||bars.length<2) return; const valid=bars.filter(b=>b); if(!valid.length) return;
  const highs=valid.map(b=>b.high), lows=valid.map(b=>b.low); let minL=Math.min(...lows), maxH=Math.max(...highs); let range=maxH-minL||1; const pad=range*0.08; minL-=pad; maxH+=pad; range=maxH-minL; const y=v=>cssH-((v-minL)/range)*cssH;
  const n=bars.length; const plotW=cssW-2; const x=i=> i/(n-1)*plotW; const bw=Math.max(1, plotW/n*0.55);
  bars.forEach((b,i)=>{ if(!b) return; const xx=x(i); const oY=y(b.open), cY=y(b.close), hY=y(b.high), lY=y(b.low); const up=b.close>=b.open; ctx.strokeStyle=up?'#e5484d':'#2ea567'; ctx.fillStyle=up?'#e5484d':'#2ea567'; ctx.beginPath(); ctx.moveTo(xx,hY); ctx.lineTo(xx,lY); ctx.stroke(); const bodyH=Math.max(1, Math.abs(cY-oY)); ctx.fillRect(xx-bw/2, Math.min(oY,cY), bw, bodyH||1); });
  const missing=bars.filter(b=>!b).length; if(missing>0){ ctx.fillStyle='#e5484d'; ctx.beginPath(); ctx.arc(cssW-4,6,3,0,Math.PI*2); ctx.fill(); }
}

function drawVOL(canvas, bars, highlightIdx){
  const dpr=window.devicePixelRatio||1; const w=canvas.clientWidth,h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!bars||!bars.length) return;
  const valid=bars.filter(b=>b);
  if(!valid.length) return;
  const maxV=Math.max(...valid.map(b=>b.vol||0))*1.2||1;
  const y=v=>h-(v/maxV)*h;
  const n=bars.length; const rightPad=10; const plotW=w-rightPad;
  const x=i=> i/(n-1)*plotW;
  const bw=Math.max(1, plotW/n*0.6);
  bars.forEach((b,i)=>{
    if(!b) return;
    const xx=x(i); const yy=y(b.vol||0); const up=b.close>=b.open;
    ctx.fillStyle=up?'#e5484d':'#2ea567'; ctx.fillRect(xx-bw/2, yy, bw, h-yy);
  });
  if(highlightIdx!=null){ const xx=x(highlightIdx); ctx.strokeStyle='#e6e9ef'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,h); ctx.stroke(); ctx.setLineDash([]); }
}
function drawZQ(canvas, zq1,zq, highlightIdx){
  const dpr=window.devicePixelRatio||1; const w=canvas.clientWidth,h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!zq1||!zq1.length) return;
  // zq可能含null，画线时跳过
  const y=v=>h-(v/100)*h;
  const n=zq1.length; const rightPad=10; const plotW=w-rightPad;
  const x=i=> i/(n-1)*plotW;
  [[100,'#3a4250'],[50,'#e5484d'],[0,'#3a4250']].forEach(([v,c])=>{ ctx.strokeStyle=c; ctx.setLineDash(v===50?[]:[3,3]); ctx.beginPath(); ctx.moveTo(0,y(v)); ctx.lineTo(plotW,y(v)); ctx.stroke();}); ctx.setLineDash([]);
  [[zq1,'#4a90e2'],[zq,'#c46be0']].forEach(([s,c])=>{ if(!s) return; ctx.strokeStyle=c; ctx.lineWidth=1.2; ctx.beginPath(); let st=false; s.forEach((v,i)=>{ if(v==null) return; const xx=x(i); if(!st){ctx.moveTo(xx,y(v));st=true;} else ctx.lineTo(xx,y(v));}); ctx.stroke();});
  const missing = zq1.filter(v=>v==null).length; if(missing>0){ ctx.fillStyle='#e5484d'; ctx.beginPath(); ctx.arc(w-10, 8, 2.5, 0, Math.PI*2); ctx.fill(); }
  if(highlightIdx!=null){ const xx=x(highlightIdx); ctx.strokeStyle='#e6e9ef'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,h); ctx.stroke(); ctx.setLineDash([]); }
}
function drawMACD(canvas, dif,dea,macd, highlightIdx){
  const dpr=window.devicePixelRatio||1; const w=canvas.clientWidth,h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!dif||!dif.length) return;
  const all=[...dif,...dea,...macd]; const max=Math.max(...all), min=Math.min(...all); const range=(max-min)||1; const y=v=>h-((v-min)/range)*h;
  const y0=y(0); ctx.strokeStyle='#3a4250'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(w-10,y0); ctx.stroke(); ctx.setLineDash([]);
  const n=dif.length; const rightPad=10; const plotW=w-rightPad; const x=i=> i/(n-1)*plotW;
  for(let i=0;i<n;i++){ const xx=x(i); const v=macd[i]; if(v==null) continue; const yy=y(v); ctx.fillStyle=v>=0?'#e5484d':'#2ea567'; ctx.fillRect(xx-1, Math.min(yy,y0), 2, Math.abs(yy-y0)); }
  [[dif,'#4a90e2'],[dea,'#e0b23c']].forEach(([s,c])=>{ ctx.strokeStyle=c; ctx.lineWidth=1.1; ctx.beginPath(); let st=false; s.forEach((v,i)=>{ if(v==null) return; const xx=x(i); if(!st){ctx.moveTo(xx,y(v));st=true;} else ctx.lineTo(xx,y(v));}); ctx.stroke();});
  if(highlightIdx!=null){ const xx=x(highlightIdx); ctx.strokeStyle='#e6e9ef'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,h); ctx.stroke(); ctx.setLineDash([]); }
}

async function fillRowQuote(item, row, isUpdating=false){
  if(isUpdating) row.classList.add('updating');

  try{
    const bars=await getHistBars(item.code,20);
    if(!bars.length) throw new Error('no bars');
    let merged=bars.slice(-20);
    let last=merged[merged.length-1];
    let prev=merged.length>=2?merged[merged.length-2]:null;
    let pct=prev?(last.close-prev.close)/prev.close*100:0;

// ---- 命中框：细黄虚线，不填充。外框=命中K线前后各5根，内框=命中那一根。
// 线都画在K线之间的缝隙上，不盖住K线（叠加在已画好的图上，不改动原有画图函数）----
function drawHitFrame(canvas, n, hitIdx, span){
  if(!canvas||hitIdx==null||hitIdx<0||hitIdx>=n||n<1) return;
  const w=canvas.clientWidth,h=canvas.clientHeight; if(!w||!h) return;
  const dpr=window.devicePixelRatio||1;
  const ctx=canvas.getContext('2d'); ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  const plotW=w-10; const step=n>1?plotW/(n-1):plotW; const x=i=>(n===1?plotW/2:i/(n-1)*plotW);
  const a=Math.max(0,hitIdx-span), b=Math.min(n-1,hitIdx+span);
  ctx.strokeStyle='rgba(255,204,0,0.9)'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  const x0=Math.max(0.5,x(a)-step/2), x1=Math.min(w-0.5,x(b)+step/2);
  ctx.strokeRect(x0,0.5,Math.max(1,x1-x0),h-1);
  const hx0=Math.max(0.5,x(hitIdx)-step/2), hx1=Math.min(w-0.5,x(hitIdx)+step/2);
  ctx.strokeRect(hx0,0.5,Math.max(1,hx1-hx0),h-1);
  ctx.restore();
}

// 以交易日历取60根的显示窗口；有命中日时窗口包含命中日（命中日前约40根、后约19根），无需手动翻
function makeWindow(merged, hitCal){
  const D=CAL.length;
  if(D>=60){
    let end=hitCal!=null?Math.min(D-1,hitCal+19):D-1;
    const start=Math.max(0,end-59); end=start+59;
    const byDate={}; merged.forEach(b=>{ if(b&&b.date) byDate[b.date]=b; });
    const toShow=CAL.slice(start,end+1).map(d=>byDate[d]||null);
    return {toShow,start,hitIdx:hitCal!=null?hitCal-start:null};
  }
  return {toShow:merged.slice(-60),start:-1,hitIdx:null};
}

//#CORE-START
// ============ 选股/回测核心：纯读取后台预先算好的 cost/zq，不做任何指标计算 ============
const COND_KEYS=['cost50','cost75','cost90','zq','zq1'];
const SERIES_ARR={cost50:'c50',cost75:'c75',cost90:'c90',zq:'zq',zq1:'zq1'};
const STATE_LABEL={up:'上升',down:'下降',sup:'陡升',sdn:'陡降'};
const DAY_LABEL={y:'昨日',t:'今日'};

function numOrNull(v){ if(v===''||v==null) return null; const f=parseFloat(v); return isFinite(f)?f:null; }
function ampText(mn,mx,unit){
  if(mn!=null&&mx!=null) return `${mn}~${mx}${unit}`;
  if(mn!=null) return `≥${mn}${unit}`;
  if(mx!=null) return `≤${mx}${unit}`;
  return '';
}

// cfg = { y:{cost50:{st,mn,mx}, ..., zq:{st,mn,mx,vmn,vmx}, zq1:{...}, cross}, t:{... zq:{...,cmp}, zq1:{...,cmp}, cross} }
// 返回条件数组 [{day,label,fn(F,b,d,p,pp)}]，d=今日下标 p=昨日下标 pp=前日下标（以该股自己的前一根有效K线为准）
function compileSel(cfg){
  const conds=[];
  for(const day of ['y','t']){
    const c=cfg&&cfg[day]; if(!c) continue;
    const isT=day==='t';
    const dl=DAY_LABEL[day];
    for(const k of COND_KEYS){
      const s=c[k]; if(!s) continue;
      const key=SERIES_ARR[k]; const isCost=k.indexOf('cost')===0; const unit=isCost?'%':'点';
      // 1) 涨跌状态 + 幅度
      if(s.st){
        const mn=numOrNull(s.mn), mx=numOrNull(s.mx), st=s.st;
        conds.push({day,label:`${dl} ${k} ${STATE_LABEL[st]}${ampText(mn,mx,unit)?' '+ampText(mn,mx,unit):''}`,fn:(F,b,d,p,pp)=>{
          const a=isT?d:p, pr=isT?p:pp; if(a<0||pr<0) return false;
          const x=F[key][b+a], y=F[key][b+pr]; if(!(x===x)||!(y===y)) return false;
          const ch=isCost?(y>0?(x/y-1)*100:NaN):(x-y); if(!(ch===ch)) return false;
          if(st==='up'||st==='sup'){ if(!(ch>0)) return false; } else { if(!(ch<0)) return false; }
          const amp=Math.abs(ch);
          if(mn!=null&&amp<mn) return false;
          if(mx!=null&&amp>mx) return false;
          return true;
        }});
      }
      if(isCost) continue;
      // 2) zq/zq1 的值区间
      const vmn=numOrNull(s.vmn), vmx=numOrNull(s.vmx);
      if(vmn!=null||vmx!=null){
        conds.push({day,label:`${dl} ${k} 值${ampText(vmn,vmx,'%')}`,fn:(F,b,d,p,pp)=>{
          const a=isT?d:p; if(a<0) return false;
          const v=F[key][b+a]; if(!(v===v)) return false;
          if(vmn!=null&&v<vmn) return false;
          if(vmx!=null&&v>vmx) return false;
          return true;
        }});
      }
      // 3) 今日变化幅度 大于/小于 昨日变化幅度（绝对值）
      if(isT&&s.cmp){
        const cmp=s.cmp;
        conds.push({day,label:`今日 ${k} 变化幅度${cmp==='gt'?'大于':'小于'}昨日`,fn:(F,b,d,p,pp)=>{
          if(d<0||p<0||pp<0) return false;
          const x0=F[key][b+d], x1=F[key][b+p], x2=F[key][b+pp];
          if(!(x0===x0)||!(x1===x1)||!(x2===x2)) return false;
          const t=Math.abs(x0-x1), y=Math.abs(x1-x2);
          return cmp==='gt'?t>y:t<y;
        }});
      }
    }
    // 4) zq 与 zq1 的位置关系 / 交叉
    if(c.cross){
      const cr=c.cross;
      const txt={up:'zq 上穿 zq1',down:'zq 下穿 zq1',above:'zq 在 zq1 上方',below:'zq 在 zq1 下方'}[cr];
      conds.push({day,label:`${dl} ${txt}`,fn:(F,b,d,p,pp)=>{
        const a=isT?d:p, pr=isT?p:pp; if(a<0) return false;
        const z=F.zq[b+a], z1=F.zq1[b+a]; if(!(z===z)||!(z1===z1)) return false;
        if(cr==='above') return z>z1;
        if(cr==='below') return z<z1;
        if(pr<0) return false;
        const zp=F.zq[b+pr], z1p=F.zq1[b+pr]; if(!(zp===zp)||!(z1p===z1p)) return false;
        if(cr==='up') return zp<=z1p&&z>z1;
        return zp>=z1p&&z<z1;
      }});
    }
  }
  return conds;
}

// 遍历 [d0,d1] 内每个交易日，对每只股票判断；今日=该日K线，昨日=该股前一根有效K线
function runScan(S, conds, d0, d1, onHit){
  const n=S.n, D=S.D, F=S.F, close=F.close;
  for(let s=0;s<n;s++){
    const b=s*D;
    for(let d=d0;d<=d1;d++){
      if(!(close[b+d]===close[b+d])) continue;
      let p=d-1; while(p>=0&&!(close[b+p]===close[b+p])) p--;
      let pp=-1; if(p>=0){ pp=p-1; while(pp>=0&&!(close[b+pp]===close[b+pp])) pp--; }
      let ok=true;
      for(let ci=0;ci<conds.length;ci++){ if(!conds[ci].fn(F,b,d,p,pp)){ ok=false; break; } }
      if(ok) onHit(s,d,p);
    }
  }
}
function doSelect(S,conds,d0,d1){
  const hits=new Map();
  runScan(S,conds,d0,d1,(s,d)=>{ let a=hits.get(s); if(!a){ a=[]; hits.set(s,a); } a.push(d); });
  return hits;
}
function nextValid(S,s,d){
  const b=s*S.D, close=S.F.close; let nx=d+1;
  while(nx<S.D&&!(close[b+nx]===close[b+nx])) nx++;
  return nx<S.D?nx:-1;
}
function pctAt(S,s,d){
  const b=s*S.D, close=S.F.close; let p=d-1;
  while(p>=0&&!(close[b+p]===close[b+p])) p--;
  if(p<0) return null;
  return (close[b+d]/close[b+p]-1)*100;
}
// 回测：命中当天收盘(尾盘)买入，下一个交易日收盘卖出
function doBacktest(S,conds,d0,d1){
  const trades=[]; let pending=0; const close=S.F.close;
  runScan(S,conds,d0,d1,(s,d)=>{
    const nx=nextValid(S,s,d);
    if(nx<0){ pending++; return; }
    const b=s*S.D;
    trades.push({s,d,nx,ret:(close[b+nx]/close[b+d]-1)*100});
  });
  return {trades,pending};
}
function calcStats(trades){
  const n=trades.length; if(!n) return null;
  const rets=trades.map(t=>t.ret).sort((a,b)=>a-b);
  const wins=rets.filter(r=>r>0), loses=rets.filter(r=>r<0);
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const avg=sum(rets)/n;
  const med=n%2?rets[(n-1)/2]:(rets[n/2-1]+rets[n/2])/2;
  const avgWin=wins.length?sum(wins)/wins.length:0, avgLoss=loses.length?sum(loses)/loses.length:0;
  return {n,win:wins.length,lose:loses.length,avg,med,max:rets[n-1],min:rets[0],avgWin,avgLoss,plr:avgLoss?avgWin/Math.abs(avgLoss):null};
}

const FKEYS=['close','c50','c75','c90','zq','zq1'];

async function loadScreenData(){
  const m=SCREEN_META; const lab=document.getElementById('sel-load');
  if(!m){ lab.textContent='未找到 data/screen，先运行一次 workflow'; return; }
  const D=m.dates.length, total=m.shards.length, parts=new Array(total);
  let done=0, next=0;
  const worker=async()=>{
    while(next<total){
      const i=next++;
      parts[i]=await fetchJSON('data/screen/'+m.shards[i],60000);
      done++; lab.textContent=`数据载入 ${done}/${total}`;
    }
  };
  try{ await Promise.all(Array.from({length:Math.min(4,total)},worker)); }
  catch(e){ lab.textContent='载入失败：'+e.message+'（刷新重试）'; return; }
  let n=0; parts.forEach(p=>{ n+=p.codes.length; });
  const F={}; FKEYS.forEach(k=>{ F[k]=new Float32Array(n*D).fill(NaN); });
  const sP=m.pscale||1000, sZ=m.zscale||100; const codes=[]; let s=0;
  parts.forEach(p=>{
    p.codes.forEach((c,ci)=>{
      codes.push(c); const base=s*D;
      FKEYS.forEach(k=>{
        const row=p[k][ci], sc=(k==='zq'||k==='zq1')?sZ:sP, arr=F[k];
        for(let d=0;d<D;d++){ const v=row[d]; if(v!=null) arr[base+d]=v/sc; }
      });
      s++;
    });
  });
  const idxOf=new Map(); codes.forEach((c,i)=>idxOf.set(c,i));
  SD={n,D,codes,F,idxOf};
  lab.textContent=`已载入 ${n} 只 × ${D} 天`;
  document.getElementById('run-sel-btn').classList.remove('off');
  document.getElementById('run-backtest-btn').classList.remove('off');
  refreshPreview();
}

function resolveRange(){
  const D=CAL.length; if(!D) return null;
  const f=document.getElementById('sel-date-from').value, t=document.getElementById('sel-date-to').value;
  if(!f&&!t) return {d0:D-1,d1:D-1,text:`最后一根K线 ${CAL[D-1]}`};
  let a=f||t, b=t||f; if(a>b){ const x=a; a=b; b=x; }
  let d0=-1, d1=-1;
  for(let i=0;i<D;i++){ if(CAL[i]>=a&&d0<0) d0=i; if(CAL[i]<=b) d1=i; }
  if(d0<0||d1<0||d0>d1) return {empty:true,text:`${a===b?a:a+'~'+b} 不在数据范围内（非交易日或超出最近${D}个交易日）`};
  return {d0,d1,text:a===b?CAL[d0]:`${CAL[d0]} ~ ${CAL[d1]}`};
}

function runBacktest(){
  if(!SD) return;
  const out=document.getElementById('backtest-results'), prog=document.getElementById('sel-progress');
  const conds=compileSel(readCfg());
  if(!conds.length){ out.innerHTML='<div class="hint">至少设置一个条件</div>'; return; }
  const D=CAL.length; if(!D){ out.innerHTML='<div class="hint">无日历数据</div>'; return; }
  const rg={d0:0,d1:D-1,text:`全部 ${D} 个交易日（${CAL[0]} ~ ${CAL[D-1]}）`};
  const t0=performance.now();
  const {trades,pending}=doBacktest(SD,conds,rg.d0,rg.d1);
  const ms=performance.now()-t0;
  prog.textContent=`${rg.text}：回测完成，用时 ${ms.toFixed(0)}ms`;
  const st=calcStats(trades);
  if(!st){ out.innerHTML=`<div class="card"><div class="hint">没有可统计的交易${pending?`（命中 ${pending} 次都在最后一根K线上，还没有次日数据）`:''}</div></div>`; return; }
  const cls=v=>v>0?'up':v<0?'down':'flat';
  const uniq=new Set(trades.map(t=>t.s)).size;
  const cell=(k,v,c)=>`<div class="stat"><div class="k">${k}</div><div class="v ${c||''}">${v}</div></div>`;
  const edges=[-Infinity,-5,-3,-1,0,1,3,5,Infinity];
  const labs=['< -5%','-5 ~ -3%','-3 ~ -1%','-1 ~ 0%','0 ~ 1%','1 ~ 3%','3 ~ 5%','≥ 5%'];
  const dist=new Array(labs.length).fill(0);
  trades.forEach(t=>{ for(let i=0;i<labs.length;i++){ if(t.ret>=edges[i]&&t.ret<edges[i+1]){ dist[i]++; break; } } });
  const dmax=Math.max(...dist,1);
  const byDate=new Map();
  trades.forEach(t=>{ let a=byDate.get(t.d); if(!a){ a=[]; byDate.set(t.d,a); } a.push(t.ret); });
  const dateRows=[...byDate.entries()].sort((a,b)=>b[0]-a[0]).map(([d,a])=>{
    const w=a.filter(x=>x>0).length, av=a.reduce((x,y)=>x+y,0)/a.length;
    return `<tr><td>${CAL[d]}</td><td>${a.length}</td><td>${(w/a.length*100).toFixed(0)}%</td><td class="${cls(av)}">${fmtPct(av)}</td></tr>`;
  }).join('');
  const sorted=trades.slice().sort((a,b)=>b.ret-a.ret);
  const rowOf=t=>`<tr class="tr-open" data-s="${t.s}" data-d="${t.d}" style="cursor:pointer"><td>${NAMES[SD.codes[t.s]]||SD.codes[t.s]}</td><td>${CAL[t.d].slice(5)}</td><td class="${cls(t.ret)}">${fmtPct(t.ret)}</td></tr>`;
  const top=sorted.slice(0,10).map(rowOf).join(''), bot=sorted.slice(-10).reverse().map(rowOf).join('');
  out.innerHTML=`<div class="card">
    <div style="font-weight:600;">回测汇总</div>
    <div class="sum-line">${rg.text}；命中当天收盘买入，下一个交易日收盘卖出；未计手续费和滑点。<br>策略：${conds.map(c=>c.label).join('；')}</div>
    <div class="stat-grid">
      ${cell('交易次数',st.n)}${cell('涉及股票',uniq+' 只')}${cell('胜率',(st.win/st.n*100).toFixed(1)+'%',st.win/st.n>=0.5?'up':'down')}
      ${cell('平均收益',fmtPct(st.avg),cls(st.avg))}${cell('中位数',fmtPct(st.med),cls(st.med))}${cell('盈亏比',st.plr!=null?st.plr.toFixed(2):'--')}
      ${cell('平均盈利',fmtPct(st.avgWin),'up')}${cell('平均亏损',fmtPct(st.avgLoss),'down')}${cell('最大/最小',st.max.toFixed(1)+' / '+st.min.toFixed(1))}
    </div>
    ${pending?`<div class="sum-line">另有 ${pending} 次命中在最后一根K线上，还没有次日数据，未计入。</div>`:''}
    <div style="font-size:11px;color:var(--dim);margin:6px 0 2px;">次日收益分布</div>
    ${labs.map((l,i)=>`<div class="dist-row"><span style="width:62px;">${l}</span><div class="bar" style="width:${dist[i]/dmax*55}%;background:${i<4?'var(--down)':'var(--up)'};"></div><span>${dist[i]}</span></div>`).join('')}
    <div style="font-size:11px;color:var(--dim);margin:10px 0 2px;">按买入日统计${byDate.size>1?'':'（单日）'}</div>
    <div style="max-height:230px;overflow-y:auto;"><table class="tbl"><thead><tr><th>买入日</th><th>次数</th><th>胜率</th><th>平均</th></tr></thead><tbody>${dateRows}</tbody></table></div>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <div style="flex:1;min-width:0;"><div style="font-size:11px;color:var(--dim);margin-bottom:2px;">单笔最佳10（点开看K线）</div><table class="tbl"><tbody>${top}</tbody></table></div>
      <div style="flex:1;min-width:0;"><div style="font-size:11px;color:var(--dim);margin-bottom:2px;">单笔最差10</div><table class="tbl"><tbody>${bot}</tbody></table></div>
    </div></div>`;
  out.querySelectorAll('.tr-open').forEach(tr=>{ tr.onclick=()=>{
    const s=parseInt(tr.dataset.s,10), d=parseInt(tr.dataset.d,10);
    openDetail(itemOf(SD.codes[s]),{hits:[d],pos:0});
  }; });
}

document.getElementById('run-sel-btn').onclick=runSelect;
document.getElementById('run-backtest-btn').onclick=runBacktest;
document.getElementById('reset-sel-btn').onclick=()=>{
  document.querySelectorAll('#sel-panes select').forEach(s=>{ s.value=''; });
  document.querySelectorAll('#sel-panes input').forEach(i=>{ i.value=''; });
  document.querySelectorAll('#sel-panes .amp').forEach(a=>{ a.style.display='none'; });
  document.getElementById('sel-date-from').value=''; document.getElementById('sel-date-to').value='';
  document.getElementById('sel-results').innerHTML=''; document.getElementById('backtest-results').innerHTML='';
  LAST_SEL=null; refreshPreview();
};

// ============ 启动 ============
(async()=>{
  await loadScreenMeta();
  showTopInfo();
  buildSelPanel();
  renderCatBar();
  renderIndexList();
  renderWatchlist();
  loadScreenData();
})();
</script>
</body>
</html>
