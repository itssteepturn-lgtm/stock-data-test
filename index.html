<!DOCTYPE html>
<html lang="zh-CN">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>盘面 · 纯后台验证</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: #151b23;
    --line: #232b36;
    --text: #e6e9ef;
    --dim: #8891a0;
    --up: #e5484d;
    --down: #2ea567;
    --accent: #4a90e2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    height:100%; overscroll-behavior-y:none;}
  #app{max-width:720px; margin:0 auto; padding:14px 14px 40px;}
  header{display:flex; align-items:baseline; justify-content:space-between; padding:6px 2px 16px;}
  header h1{font-size:19px; font-weight:600; margin:0; letter-spacing:.3px;}
  #clock{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;}
  .idx-row{display:flex; align-items:center; gap:12px;}
  .idx-name{width:64px; flex-shrink:0;}
  .idx-name .n{font-size:14px; font-weight:600;}
  .idx-name .c{font-size:11px; color:var(--dim); margin-top:2px;}
  .idx-chart{flex:1; height:44px;}
  .idx-price{width:92px; text-align:right; flex-shrink:0;}
  .idx-price .p{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;}
  .idx-price .pct{font-size:12px; margin-top:2px; font-variant-numeric:tabular-nums;}
  .up{color:var(--up);}
  .down{color:var(--down);}
  .flat{color:var(--dim);}
  .section-label{font-size:12px; color:var(--dim); margin:22px 2px 8px; letter-spacing:.5px;}
  #detail{position:fixed; inset:0; background:var(--bg); transform:translateY(100%);
    transition:transform .28s ease; z-index:10; overflow-y:auto;}
  #detail.open{transform:translateY(0);}
  #detail-inner{max-width:720px; margin:0 auto; padding:14px 14px 40px;}
  .detail-head{display:flex; align-items:center; gap:10px; padding:6px 2px 14px;}
  .back{font-size:22px; color:var(--text); padding:4px 8px 4px 0; line-height:1;}
  .detail-head .title{font-size:17px; font-weight:600;}
  .tabs{display:flex; gap:8px; margin:10px 0 14px;}
  .tab{font-size:13px; padding:6px 14px; border-radius:8px; background:var(--panel);
    border:1px solid var(--line); color:var(--dim);}
  .tab.active{color:var(--text); border-color:var(--accent); background:rgba(74,144,226,.12);}
  #bigchart{width:100%; height:280px; background:var(--panel); border:1px solid var(--line); border-radius:10px;}
  .hint{font-size:12px; color:var(--dim); text-align:center; padding:14px 0;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>盘面 · 纯后台验证</h1>
    <div id="clock">--:--:--</div>
  </header>
  <div id="data-status" style="font-size:11px; color:var(--dim); margin:-10px 2px 14px; display:flex; justify-content:space-between; align-items:center;">
    <span id="data-status-text">数据状态：检查中…</span>
    <span id="data-status-refresh" style="color:var(--accent); cursor:pointer;">打开Actions</span>
  </div>

  <div class="section-label">指数（后台无指数数据会显示后台无数据）</div>
  <div id="idx-list"></div>

  <div class="section-label" id="watchlist-label" style="display:flex; justify-content:space-between; align-items:center;">
    <span>自选股 · 14只后台150天</span>
    <span id="edit-toggle" style="color:var(--accent); cursor:pointer;">编辑</span>
  </div>
  <div id="watch-list"></div>
  <div class="card" style="display:flex; gap:8px; align-items:center;">
    <input id="add-code" type="tel" inputmode="numeric" placeholder="输入6位股票代码（纯后台版需先有后台数据）"
      style="flex:1; background:transparent; border:none; color:var(--text); font-size:14px; outline:none;">
    <div id="add-btn" style="color:var(--accent); font-size:14px; padding:4px 8px;">添加</div>
  </div>
  <div id="add-msg" class="hint" style="display:none; padding:6px 0 0;"></div>

  <div id="detail">
    <div id="detail-inner">
      <div class="detail-head"><div class="back" id="detail-back">‹</div><div class="title" id="detail-title">--</div></div>
      <div class="tabs"><div class="tab active" data-tab="k">日K + COST</div><div class="tab" data-tab="zq">ZQ</div></div>
      <canvas id="bigchart"></canvas>
      <div class="hint" id="detail-hint"></div>
    </div>
  </div>
</div>

<script>
// ---- 配置 ----
const DATA_REPO = 'itssteepturn-lgtm/stock-data-test';
const DATA_BRANCH = 'main';
const TEST_CODES = ['300642','300740','002579','002584','003001','301086','600880','002708','600127','600088','688175','301390','603248','688004'];
const TEST_INDEXES = [
  {code:'1.000001', name:'上证指数', short:'000001', type:'index'},
  {code:'0.399001', name:'深证成指', short:'399001', type:'index'},
  {code:'0.399006', name:'创业板指', short:'399006', type:'index'},
  {code:'1.000688', name:'科创50', short:'000688', type:'index'},
];

// 时钟
setInterval(()=>{ document.getElementById('clock').textContent = new Date().toLocaleTimeString(); }, 1000);

function todayStrLocal(){
  const d = new Date(); const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function codeToSecid(code){
  if(/^(6|9)/.test(code)) return '1.'+code;
  if(/^(0|2|3)/.test(code)) return '0.'+code;
  if(/^(4|8)/.test(code)) return '0.'+code;
  return null;
}

// ---- 后台数据 ----
async function getFullHistory(secid, limit=150){
  const code = secid.split('.')[1];
  const url = `https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/data/stocks/${code}.json?t=${Date.now()}`;
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('后台没有 '+code);
  const j = await res.json();
  const bars = j.bars || j;
  if(!bars || bars.length<10) throw new Error('后台数据不足 '+code);
  return bars.slice(-Math.min(limit,150)).map(b=>({
    date:b.date, open:b.open, close:b.close, high:b.high, low:b.low,
    vol:b.vol, amount:b.amount, turnover:b.turnover,
    avg: b.avg || (b.amount && b.vol ? b.amount/(b.vol*100) : b.close),
    cost50:b.cost50, cost75:b.cost75, cost90:b.cost90, zq1:b.zq1, zq:b.zq, vwma10:b.vwma10,
    _precomputed:true
  }));
}
const histCache = {};
async function getHistBars(secid, limit){
  if(histCache[secid] && histCache[secid].length>=Math.min(limit,150)) return histCache[secid];
  const bars = await getFullHistory(secid, limit);
  histCache[secid]=bars;
  return bars;
}
function computeIndicatorSeries(bars){
  if(bars.length && bars[0].cost50!=null && bars[0]._precomputed){
    return {
      cost50: bars.map(b=>b.cost50),
      cost75: bars.map(b=>b.cost75),
      cost90: bars.map(b=>b.cost90),
      zq1: bars.map(b=>b.zq1),
      zq: bars.map(b=>b.zq),
      vwma10: bars.map(b=>b.vwma10),
    };
  }
  return { cost50:[], cost75:[], cost90:[], zq1:[], zq:[], vwma10:[] };
}
async function buildStockEntry(secid, limit){
  const histBars = await getHistBars(secid, limit);
  const { cost50, cost75, cost90, zq1, zq, vwma10 } = computeIndicatorSeries(histBars);
  return { bars: histBars, cost50, cost75, cost90, zq1, zq, vwma10 };
}

// ---- 绘制 ----
function drawMainWithCost(canvas, bars, cost50, cost75, cost90){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!bars || !bars.length) return;
  const allVals = [...bars.map(b=>b.high), ...bars.map(b=>b.low), ...cost50.filter(v=>v!=null), ...cost75.filter(v=>v!=null), ...cost90.filter(v=>v!=null)].filter(v=>isFinite(v)&&v>0);
  const max = Math.max(...allVals), min = Math.min(...allVals); const range = (max-min)||1; const n=bars.length; const cw=w/n; const y=v=>h-((v-min)/range)*h;
  bars.forEach((k,i)=>{
    const x=i*cw+cw/2; const up=k.close>=k.open; ctx.strokeStyle=ctx.fillStyle=up?'#e5484d':'#2ea567'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,y(k.high)); ctx.lineTo(x,y(k.low)); ctx.stroke();
    const yO=y(k.open), yC=y(k.close); const bw=Math.max(cw*0.55,1.5); ctx.fillRect(x-bw/2, Math.min(yO,yC), bw, Math.max(Math.abs(yC-yO),1));
  });
  [[cost50,'#2ea567'],[cost75,'#e0b23c'],[cost90,'#e5484d']].forEach(([series,color])=>{
    ctx.strokeStyle=color; ctx.lineWidth=1.3; ctx.beginPath(); let started=false;
    series.forEach((v,i)=>{ if(v==null) return; const x=i*cw+cw/2; if(!started){ctx.moveTo(x,y(v)); started=true;} else ctx.lineTo(x,y(v)); }); ctx.stroke();
  });
}
function drawSubChart(canvas, zq1, zq){
  const dpr = window.devicePixelRatio || 1; const w=canvas.clientWidth, h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h); if(!zq1||!zq1.length) return;
  const n=zq1.length; const y=v=>h-(v/100)*h;
  [[100,'#3a4250'],[50,'#e5484d'],[0,'#3a4250']].forEach(([v,color])=>{ ctx.strokeStyle=color; ctx.lineWidth=1; ctx.setLineDash(v===50?[]:[3,3]); ctx.beginPath(); ctx.moveTo(0,y(v)); ctx.lineTo(w,y(v)); ctx.stroke(); }); ctx.setLineDash([]);
  [[zq1,'#4a90e2'],[zq,'#c46be0']].forEach(([series,color])=>{ ctx.strokeStyle=color; ctx.lineWidth=1.3; ctx.beginPath(); let started=false; series.forEach((v,i)=>{ if(v==null) return; const x=(i/(n-1))*w; if(!started){ctx.moveTo(x,y(v)); started=true;} else ctx.lineTo(x,y(v)); }); ctx.stroke(); });
}

// ---- 列表 ----
function buildRow(item, container, onClick){
  const row=document.createElement('div'); row.className='card idx-row';
  row.innerHTML=`<div class="idx-name"><div class="n">${item.name}</div><div class="c">${item.short}</div></div><canvas class="idx-chart" width="80" height="44"></canvas><div class="idx-price"><div class="p">--</div><div class="pct">加载中</div></div>`;
  row.onclick=()=>onClick(item,row); container.appendChild(row); return row;
}
async function fillRowQuote(item, row){
  try{
    const bars=await getHistBars(item.code,60); if(!bars.length) throw new Error('no bars');
    const last=bars[bars.length-1]; const prev=bars.length>=2?bars[bars.length-2]:null; const pct=prev?(last.close-prev.close)/prev.close*100:0;
    const priceEl=row.querySelector('.p'); const pctEl=row.querySelector('.pct');
    if(priceEl) priceEl.textContent=last.close.toFixed(2);
    if(pctEl){ pctEl.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%'; pctEl.className='pct '+(pct>0?'up':pct<0?'down':'flat'); priceEl.className='p '+(pct>0?'up':pct<0?'down':'flat'); }
    const canvas=row.querySelector('canvas'); if(canvas){ const ctx=canvas.getContext('2d'); const w=canvas.width,h=canvas.height; ctx.clearRect(0,0,w,h); const closes=bars.map(b=>b.close); const minC=Math.min(...closes), maxC=Math.max(...closes); const range=maxC-minC||1; ctx.beginPath(); ctx.strokeStyle=pct>=0?'#e5484d':'#2ea567'; ctx.lineWidth=1; closes.forEach((c,i)=>{ const x=i/(closes.length-1)*w; const y=h-(c-minC)/range*h; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }); ctx.stroke(); }
  }catch(e){ const priceEl=row.querySelector('.p'); if(priceEl) priceEl.textContent='后台无数据'; const pctEl=row.querySelector('.pct'); if(pctEl) pctEl.textContent=e.message; }
}
async function renderIndexList(){
  const list=document.getElementById('idx-list'); list.innerHTML='';
  const rows=TEST_INDEXES.map(idx=>buildRow(idx,list,openDetail));
  await Promise.all(TEST_INDEXES.map((idx,i)=>fillRowQuote(idx,rows[i])));
}

// ---- 自选股 ----
const WL_KEY='stockapp_watchlist_backend150_v2';
function loadWatchlist(){
  try{
    let wl=JSON.parse(localStorage.getItem(WL_KEY));
    if(!wl || wl.length===0){
      wl=TEST_CODES.map(c=>{ const secid=codeToSecid(c); return {code:secid, name:c, short:c, type:'stock'}; });
      localStorage.setItem(WL_KEY, JSON.stringify(wl));
    }
    return wl;
  }catch(e){
    return TEST_CODES.map(c=>{ const secid=codeToSecid(c); return {code:secid, name:c, short:c, type:'stock'}; });
  }
}
function saveWatchlist(list){ localStorage.setItem(WL_KEY, JSON.stringify(list)); }
let editMode=false;
async function renderWatchlist(){
  const list=document.getElementById('watch-list'); list.innerHTML='';
  const wl=loadWatchlist();
  const rows=wl.map(item=>buildRow(item,list,(it,row)=>{
    if(editMode){
      if(confirm(`从自选股中删除 ${it.name}？`)){
        const updated=loadWatchlist().filter(x=>x.code!==it.code);
        saveWatchlist(updated); renderWatchlist();
      }
    }else{ openDetail(it); }
  }));
  await Promise.all(wl.map((it,i)=>fillRowQuote(it,rows[i])));
}
document.getElementById('edit-toggle').onclick=()=>{
  editMode=!editMode;
  document.getElementById('edit-toggle').textContent=editMode?'完成':'编辑';
  document.getElementById('edit-toggle').style.color=editMode?'var(--up)':'var(--accent)';
};
document.getElementById('add-btn').onclick=async()=>{
  const input=document.getElementById('add-code'); const msg=document.getElementById('add-msg');
  const code=input.value.trim(); msg.style.display='block';
  if(!/^\d{6}$/.test(code)){ msg.textContent='请输入6位数字代码'; return; }
  const secid=codeToSecid(code); if(!secid){ msg.textContent='无法识别的代码格式'; return; }
  const wl=loadWatchlist(); if(wl.some(x=>x.code===secid)){ msg.textContent='已经在自选股里了'; return; }
  // 纯后台版：先检查后台有没有这个代码的数据
  msg.textContent='检查后台是否有数据...';
  try{
    const bars=await getFullHistory(secid,10);
    wl.unshift({code:secid, name:code, short:code, type:'stock'});
    saveWatchlist(wl); input.value=''; msg.style.display='none'; renderWatchlist();
  }catch(e){
    msg.textContent='后台还没有 '+code+' 的数据，先跑脚本抓一下';
  }
};

// ---- 详情 ----
let currentTab='k';
document.querySelectorAll('.tab').forEach(tab=>{ tab.onclick=()=>{ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); tab.classList.add('active'); currentTab=tab.dataset.tab; if(window._lastEntry) renderDetailChart(window._lastEntry); }; });
function renderDetailChart(entry){
  const canvas=document.getElementById('bigchart');
  if(currentTab==='k') drawMainWithCost(canvas, entry.bars, entry.cost50, entry.cost75, entry.cost90);
  else drawSubChart(canvas, entry.zq1, entry.zq);
}
async function openDetail(item){
  document.getElementById('detail').classList.add('open');
  document.getElementById('detail-title').textContent=item.name+' '+item.short;
  document.getElementById('detail-hint').textContent='加载后台150天...';
  try{
    const entry=await buildStockEntry(item.code,150);
    window._lastEntry=entry;
    renderDetailChart(entry);
    document.getElementById('detail-hint').textContent=`${entry.bars.length}根｜${entry.bars[0].date} ~ ${entry.bars[entry.bars.length-1].date}｜cost50:${entry.cost50[entry.cost50.length-1]?.toFixed(2)} zq:${entry.zq[entry.zq.length-1]?.toFixed(1)}%`;
  }catch(e){ document.getElementById('detail-hint').textContent='加载失败: '+e.message; }
}
document.getElementById('detail-back').onclick=()=>{ document.getElementById('detail').classList.remove('open'); };

async function checkDataStatus(){
  const el=document.getElementById('data-status-text');
  el.textContent='纯后台验证｜已切断东财腾讯｜14只 150天 cost/zq后台预计算';
  try{
    const url=`https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/data/meta.json?t=${Date.now()}`;
    const res=await fetch(url,{cache:'no-store'}); if(res.ok){ const meta=await res.json(); const timeStr=meta.ranAt?new Date(meta.ranAt).toLocaleString():'--'; el.textContent=`${timeStr} ｜后台${meta.total}只 已存${meta.updated}只｜${meta.note||''}｜纯后台`; }
  }catch(e){}
}
document.getElementById('data-status-refresh').onclick=()=>{ window.open(`https://github.com/${DATA_REPO}/actions`, '_blank'); };

renderIndexList();
renderWatchlist();
checkDataStatus();
</script>
