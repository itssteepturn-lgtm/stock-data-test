<title>盘面 · 正式版 全市场</title>
<style>
  :root{--bg:#0d1117;--panel:#151b23;--line:#232b36;--text:#e6e9ef;--dim:#8891a0;--up:#e5484d;--down:#2ea567;--accent:#4a90e2;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;height:100%;overscroll-behavior-y:none;}
  #app{max-width:760px;margin:0 auto;padding:12px 12px 80px;}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 12px;}
  header h1{font-size:18px;font-weight:700;margin:0;}
  #clock{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;position:relative;overflow:hidden;}
  .card.updating::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);animation:shimmer 1.2s infinite;}
  @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .idx-row{display:flex;align-items:center;gap:10px;}
  .idx-name{width:66px;flex-shrink:0;}
  .idx-name .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .idx-name .c{font-size:10px;color:var(--dim);}
  .idx-chart{flex:1;height:42px;}
  .idx-price{width:108px;text-align:right;flex-shrink:0;}
  .idx-price .p{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  .idx-price .pct{font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--dim);}
  .section-label{font-size:11px;color:var(--dim);margin:20px 2px 8px;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center;}
  .pill{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--dim);cursor:pointer;}
  .pill.active{color:var(--text);border-color:var(--accent);background:rgba(74,144,226,.12);}
  #detail{position:fixed;inset:0;background:var(--bg);transform:translateY(100%);transition:transform .28s ease;z-index:20;overflow-y:auto;}
  #detail.open{transform:translateY(0);}
  #detail-inner{max-width:760px;margin:0 auto;padding:12px 12px 20px;}
  .detail-head{display:flex;align-items:center;gap:10px;padding:6px 2px 8px;position:sticky;top:0;background:var(--bg);z-index:2;}
  .back{font-size:22px;padding:2px 8px 2px 0;}
  .detail-head .title{font-size:15px;font-weight:600;flex:1;}
  .detail-kv{display:flex;gap:12px;font-size:11px;color:var(--dim);flex-wrap:wrap;margin:4px 0 6px;}
  .detail-kv b{color:var(--text);font-weight:600;}
  canvas.chart{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:block;margin-bottom:6px;}
  canvas.chart.main{height:260px;}
  canvas.chart.zq{height:105px;}
  canvas.chart.intra{height:135px;}
  canvas.chart.vol{height:52px;}
  canvas.chart.macd{height:52px;}
  canvas.chart.mini{height:42px;background:transparent;border:none;}
  .value-tags{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--dim);margin:2px 0 6px;}
  .value-tags span{border:1px solid var(--line);border-radius:6px;padding:2px 6px;}
  .hint{font-size:11px;color:var(--dim);text-align:center;padding:10px 0;}
  .cond-row{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:12px;}
  .cond-row label.lbl{width:70px;color:var(--dim);flex-shrink:0;}
  .cond-row select,.cond-row input[type=number],.cond-row input[type=date]{flex:1;background:#0d1117;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;min-width:0;}
  .btn{font-size:12px;padding:6px 14px;border-radius:8px;background:var(--accent);color:#fff;display:inline-block;cursor:pointer;text-align:center;}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--text);}
  .btn.danger{background:var(--up);}
  #sel-results .res-card{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel);margin-bottom:8px;}
  .cat-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;}
  .cat-bar .pill{white-space:nowrap;}
</style>

<body>
<div id="app">
  <header>
    <h1>盘面 · 正式版 全市场 150天</h1>
    <div id="clock">--:--:--</div>
  </header>
  <div id="data-status" style="font-size:10px;color:var(--dim);margin:-8px 2px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
    <span id="data-status-text">检查中…</span>
    <span style="display:flex;gap:6px;align-items:center;">
      <span id="src-toggle" class="pill active" style="padding:2px 8px;">东财</span>
      <span id="data-status-refresh" class="pill" style="padding:2px 8px;">Actions</span>
    </span>
  </div>

  <div class="section-label"><span>指数 · 后台150天+当日实时K</span><span style="font-size:10px;color:var(--dim);">点进看分时+K+VOL+MACD</span></div>
  <div id="idx-list"></div>

  <div class="section-label"><span>自选股 <span id="wl-count" style="color:var(--dim);"></span></span><span id="edit-toggle" class="pill">编辑</span></div>
  <div class="cat-bar" id="cat-bar"></div>
  <div id="watch-list"></div>
  <div class="card" style="display:flex;gap:8px;align-items:center;">
    <input id="add-code" type="tel" inputmode="numeric" placeholder="6位代码，加到当前分类，最新的在最前" style="flex:1;background:transparent;border:none;color:var(--text);font-size:13px;outline:none;">
    <input id="add-cat" type="text" placeholder="分类" style="width:70px;background:#0d1117;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;color:var(--text);">
    <div id="add-btn" class="btn" style="padding:5px 12px;">添加</div>
  </div>
  <div id="add-msg" class="hint" style="display:none;"></div>

  <div class="section-label" style="margin-top:26px;">选股 · 边选边出 + 暂停 + 涨跌幅排序</div>
  <div class="card" style="font-size:12px;">
    <div class="cond-row"><label class="lbl">日期区间</label><input id="sel-date-from" type="date"><span style="color:var(--dim);">至</span><input id="sel-date-to" type="date"></div>
    <div id="cond-builder"></div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <div id="run-sel-btn" class="btn">开始选股</div>
      <div id="stop-scan-btn" class="btn ghost" style="display:none;">暂停</div>
      <div id="run-backtest-btn" class="btn ghost">回测(尾盘买次日)</div>
    </div>
    <div id="sel-progress" class="hint"></div>
  </div>
  <div id="sel-results"></div>
  <div id="backtest-results"></div>

  <div id="detail">
    <div id="detail-inner">
      <div class="detail-head"><div class="back" id="detail-back">‹</div><div class="title" id="detail-title">--</div><div id="detail-src" class="pill">东财</div></div>
      <div id="detail-meta" class="hint" style="text-align:left;padding:2px 0 4px;"></div>
      <div id="detail-price" class="detail-kv"></div>
      <div id="detail-cost" class="value-tags"></div>
      <canvas id="chart-main" class="chart main"></canvas>
      <canvas id="chart-sub" class="chart zq"></canvas>
      <canvas id="chart-intra" class="chart intra"></canvas>
      <canvas id="chart-vol" class="chart vol"></canvas>
      <canvas id="chart-macd" class="chart macd"></canvas>
      <div id="detail-zq" class="value-tags"></div>
      <div class="hint" id="detail-hint">点击K线显示光标，再点返回</div>
    </div>
  </div>
</div>

<script>
const DATA_REPO='itssteepturn-lgtm/stock-data-test';
const DATA_BRANCH='main';
const TEST_CODES=['300642','300740','002579','002584','003001','301086','600880','002708','600127','600088','688175','301390','603248','688004'];
const TEST_INDEXES=[
  {code:'1.000001',name:'上证指数',short:'000001',type:'index'},
  {code:'0.399001',name:'深证成指',short:'399001',type:'index'},
  {code:'0.399006',name:'创业板指',short:'399006',type:'index'},
  {code:'1.000688',name:'科创50',short:'000688',type:'index'},
];
let SRC='east';
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString();},1000);
function codeToSecid(code){
  if(/^(6|9)/.test(code)) return '1.'+code;
  if(/^(0|2|3)/.test(code)) return '0.'+code;
  if(/^(4|8)/.test(code)) return '0.'+code;
  return null;
}
function todayStrLocal(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function buildStockUrls(code){
  const t=Date.now();
  return [
    `./data/stocks/${code}.json?t=${t}`,
    `https://cdn.jsdelivr.net/gh/${DATA_REPO}@${DATA_BRANCH}/data/stocks/${code}.json?t=${t}`,
    `https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/data/stocks/${code}.json?t=${t}`
  ];
}
function buildIndexUrls(code){
  const t=Date.now();
  return [
    `./data/indices/${code}.json?t=${t}`,
    `https://cdn.jsdelivr.net/gh/${DATA_REPO}@${DATA_BRANCH}/data/indices/${code}.json?t=${t}`,
    `https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/data/indices/${code}.json?t=${t}`,
    ...buildStockUrls(code)
  ];
}
function buildMetaUrls(){
  const t=Date.now();
  return [
    `./data/meta.json?t=${t}`,
    `https://cdn.jsdelivr.net/gh/${DATA_REPO}@${DATA_BRANCH}/data/meta.json?t=${t}`,
    `https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/data/meta.json?t=${t}`
  ];
}
async function fetchJsonWithFallback(urls, timeoutMs=3500){
  const ctrls=urls.map(()=>new AbortController());
  const ps=urls.map((url,i)=>{
    const ctrl=ctrls[i];
    const tm=setTimeout(()=>ctrl.abort(),timeoutMs);
    return fetch(url,{cache:'no-store',signal:ctrl.signal}).then(async r=>{
      clearTimeout(tm);
      if(!r.ok) throw new Error('http '+r.status);
      const j=await r.json();
      ctrls.forEach((c,idx)=>{ if(idx!==i) try{c.abort();}catch(e){} });
      return j;
    }).catch(e=>{ clearTimeout(tm); throw e; });
  });
  if(Promise.any) return await Promise.any(ps);
  return await new Promise((res,rej)=>{let f=0,last=null;ps.forEach(p=>p.then(res).catch(e=>{f++;last=e;if(f===ps.length) rej(last);}));});
}
async function getFullHistory(secid, limit=150){
  const code=secid.split('.')[1];
  const isIndex=TEST_INDEXES.some(x=>x.short===code);
  const urls=isIndex?buildIndexUrls(code):buildStockUrls(code);
  const j=await fetchJsonWithFallback(urls,3500);
  const raw=j.bars||j;
  if(!raw||raw.length<1) throw new Error('后台无 '+code);
  const bars=Array.isArray(raw)?raw:(raw.bars||[]);
  return bars.slice(-Math.min(limit,150)).map(b=>({
    date:b.date,open:b.open,close:b.close,high:b.high,low:b.low,vol:b.vol||0,amount:b.amount||0,turnover:b.turnover||0,
    avg:b.avg||(b.amount&&b.vol?b.amount/(b.vol*100):b.close),
    cost50:b.cost50,cost75:b.cost75,cost90:b.cost90,zq1:b.zq1,zq:b.zq,vwma10:b.vwma10,
    _pre:true
  }));
}
const histCache={};
async function getHistBars(secid, limit){
  if(histCache[secid]) return JSON.parse(JSON.stringify(histCache[secid])).slice(-Math.min(limit,150));
  const bars=await getFullHistory(secid, limit);
  histCache[secid]=bars;
  return JSON.parse(JSON.stringify(bars)).slice(-Math.min(limit,150));
}
async function getLiveQuoteFull(secid){
  try{
    const url=`https://push2.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f43,f44,f45,f46,f47,f48,f57,f58,f60,f19,f20,f18,f170`;
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok) throw new Error('east live http');
    const data=await res.json();
    const d=data?.data; if(!d||!d.f43) throw new Error('east live no data');
    let price=d.f43/100, open=d.f46?d.f46/100:price, high=d.f44?d.f44/100:price, low=d.f45?d.f45/100:price;
    let vol=d.f47?d.f47/100:0, amount=d.f48||0;
    let preClose=d.f60?d.f60/100:null;
    if(preClose && price>0 && Math.abs(preClose - price)/price > 0.3){ preClose=null; }
    if(preClose!==null && preClose<=0) preClose=null;
    let pct=0;
    if(price && preClose) pct=(price-preClose)/preClose*100;
    else if(d.f170!=null) pct=d.f170/100;
    else if(d.f19!=null) pct=d.f19/100;
    return { price, open, high, low, vol, amount, preClose, pct };
  }catch(e){ return null; }
}
function getUnifiedPreClose(live, bars){
  if(!bars||!bars.length) return {realPreClose: live?.preClose||null, prevBar:null};
  const today=todayStrLocal();
  const lastA=bars[bars.length-1];
  let prevBar=null;
  if(lastA.date===today){ prevBar=bars.length>=2?bars[bars.length-2]:null; }
  else{ prevBar=lastA; }
  let realPreClose=live?.preClose||null;
  if(!realPreClose && prevBar) realPreClose=prevBar.close;
  if(live && realPreClose && live.price>0 && Math.abs(realPreClose-live.price)/live.price>0.3){
    realPreClose=prevBar?prevBar.close:realPreClose;
  }
  return {realPreClose, prevBar};
}
function mergeAB(bars, live){
  if(!bars||!bars.length) return [];
  if(!live) return bars.slice();
  const today=todayStrLocal();
  const lastA=bars[bars.length-1];
  const liveBarBase={date:today, open:live.open, close:live.price, high:live.high, low:live.low, vol:live.vol, amount:live.amount, _live:true};
  if(lastA.date===today){
    const mergedLast={...lastA, ...liveBarBase, high:Math.max(lastA.high, live.high), low:Math.min(lastA.low, live.low), close:live.price, _live:true};
    mergedLast.cost50=lastA.cost50; mergedLast.cost75=lastA.cost75; mergedLast.cost90=lastA.cost90;
    mergedLast.zq1=lastA.zq1; mergedLast.zq=lastA.zq; mergedLast.vwma10=lastA.vwma10;
    const copy=bars.slice(); copy[copy.length-1]=mergedLast; return copy;
  }else{
    const bBar={...liveBarBase, cost50:lastA.cost50, cost75:lastA.cost75, cost90:lastA.cost90, zq1:lastA.zq1, zq:lastA.zq, vwma10:lastA.vwma10};
    const copy=bars.slice(); copy.push(bBar); return copy;
  }
}

async function getIntraday(secid){
  try{
    const url=`https://push2.eastmoney.com/api/qt/stock/trends2/get?secid=${secid}&fields1=f1,f2,f3,f4,f5,f6,f7,f8&fields2=f51,f52,f53,f54&iscr=0&iscca=0`;
    const res=await fetch(url,{cache:'no-store'}); const data=await res.json();
    const trends=data?.data?.trends; if(!trends) return [];
    return trends.map(t=>{ const a=t.split(','); return {time:a[0].slice(11,16),price:+a[1], avg:+a[2]}; });
  }catch(e){ return []; }
}
function calcMACD(closes){
  const ema=(arr,period)=>{
    const k=2/(period+1); let e=[]; let prev=arr[0];
    for(let i=0;i<arr.length;i++){ const v=arr[i]; prev=i===0?v:v*k+prev*(1-k); e.push(prev);} return e;
  };
  const ema12=ema(closes,12), ema26=ema(closes,26);
  const dif=closes.map((_,i)=>ema12[i]-ema26[i]);
  const dea=ema(dif,9);
  const macd=dif.map((d,i)=>(d-dea[i])*2);
  return {dif,dea,macd};
}
// ---- 绘制 ----
// cost颜色：以前 50绿色 75黄色 90红色，都是实线
const COST_COLORS={50:'#2ea567',75:'#e0b23c',90:'#e5484d'};

function drawMain(canvas, bars, costLines, highlightIdx, isIndex=false){
  const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!bars||!bars.length) return;
  const highs=bars.map(b=>b.high), lows=bars.map(b=>b.low);
  let minL=Math.min(...lows), maxH=Math.max(...highs); let pad=(maxH-minL)*0.08||1;
  let minY=minL-pad, maxY=maxH+pad; let range=maxY-minY||1;
  const y=v=>h-((v-minY)/range)*h;
  const n=bars.length;
  // 留右边 8px 边距，保证最新K线看全
  const rightPad=10;
  const plotW=w-rightPad;
  const x=i=> (n===1?plotW/2 : i/(n-1)*plotW);
  const bw=Math.max(2, plotW/n*0.6);

  // cost 实线
  if(!isIndex && costLines){
    const order=[50,75,90];
    costLines.forEach((line,li)=>{
      if(!line) return;
      const key=order[li];
      ctx.strokeStyle=COST_COLORS[key]||'#888'; ctx.lineWidth=1; ctx.setLineDash([]); // 实线
      ctx.beginPath(); let st=false;
      line.forEach((v,i)=>{ if(v==null) return; const xx=x(i); if(!st){ctx.moveTo(xx,y(v));st=true;} else ctx.lineTo(xx,y(v));}); ctx.stroke();
    });
  }

  bars.forEach((b,i)=>{
    const xx=x(i); const oY=y(b.open), cY=y(b.close), hY=y(b.high), lY=y(b.low);
    const up=b.close>=b.open;
    ctx.strokeStyle=up?'#e5484d':'#2ea567'; ctx.fillStyle=up?'#e5484d':'#2ea567';
    ctx.beginPath(); ctx.moveTo(xx,hY); ctx.lineTo(xx,lY); ctx.stroke();
    const bodyH=Math.max(1, Math.abs(cY-oY));
    ctx.fillRect(xx-bw/2, Math.min(oY,cY), bw, bodyH||1);
  });

  // 最新价标签，像分时那样，显示在主图右上角
  const last=bars[bars.length-1];
  if(last && last._live){
    const prev=bars.length>=2?bars[bars.length-2]:null;
    const pct=prev? (last.close-prev.close)/prev.close*100:0;
    const col=pct>=0?'#e5484d':'#2ea567';
    ctx.fillStyle=col; ctx.font='11px sans-serif';
    ctx.fillText(`${last.close.toFixed(2)} ${pct>=0?'+':''}${pct.toFixed(2)}%`, 6, 14);
  }

  if(highlightIdx!=null){
    const xx=x(highlightIdx); ctx.strokeStyle='#e6e9ef'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,h); ctx.stroke(); ctx.setLineDash([]);
    // 光标处显示日期和涨跌幅
    const b=bars[highlightIdx]; if(b){
      const prev=bars[highlightIdx-1]; const pct=prev? (b.close-prev.close)/prev.close*100:0;
      const isLive=b._live?' 最新':''; 
      const txt=`${b.date} ${b.close.toFixed(2)} ${pct>=0?'+':''}${pct.toFixed(2)}%${isLive}`;
      ctx.fillStyle='#e6e9ef'; ctx.font='10px sans-serif';
      const tx=Math.min(xx+4, w-120); ctx.fillText(txt, tx, 12);
    }
  }
}

function drawMiniK(canvas, bars){
  const dpr=window.devicePixelRatio||1;
  const cssW=canvas.clientWidth||80, cssH=canvas.clientHeight||42;
  canvas.width=cssW*dpr; canvas.height=cssH*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,cssW,cssH);
  if(!bars||bars.length<2) return;
  const show=bars.slice(-60);
  const highs=show.map(b=>b.high), lows=show.map(b=>b.low);
  let minL=Math.min(...lows), maxH=Math.max(...highs);
  let range=maxH-minL||1; const pad=range*0.08; minL-=pad; maxH+=pad; range=maxH-minL;

function getLimitPct(secid){
  const code=secid.split('.')[1];

function drawIntra(canvas, trends, prevClose, secid){

}

function buildRow(item, container, onClick){
  const row=document.createElement('div'); row.className='card idx-row';
  row.innerHTML=`<div class="idx-name"><div class="n">${item.name}</div><div class="c">${item.short}</div></div><canvas class="idx-chart mini" width="80" height="42"></canvas><div class="idx-price"><div class="p">--</div><div class="pct">加载中</div></div>`;
  row.onclick=()=>onClick(item,row); container.appendChild(row); return row;

async function fillRowQuote(item, row, isUpdating=false){
  if(isUpdating) row.classList.add('updating');
  else { row.classList.add('updating'); setTimeout(()=>row.classList.remove('updating'), 800); }
  try{
    const bars=await getHistBars(item.code,60);
    if(!bars.length) throw new Error('no bars');
    const live=await getLiveQuoteFull(item.code);
    let last=bars[bars.length-1];
    let prev=bars.length>=2?bars[bars.length-2]:null;
    let pct=0;
    if(prev) pct=(last.close-prev.close)/prev.close*100;
    if(live && live.preClose){
      const today=todayStrLocal();
      const isSameDay=last.date===today;
      if(isSameDay){
        last={...last, close:live.price, high:Math.max(last.high, live.high), low:Math.min(last.low, live.low), _live:true};
        bars[bars.length-1]=last;
      } else {
        last={date:today, open:live.open, close:live.price, high:live.high, low:live.low, vol:live.vol, _live:true};
        bars.push(last);
      }
      if(Math.abs(live.pct)>0.001) pct=live.pct;
      else if(prev) pct=(live.price-prev.close)/prev.close*100;
      else if(live.preClose) pct=(live.price-live.preClose)/live.preClose*100;
    } else if(live){
      // 指数 preClose 异常时，用上一根算
      const today=todayStrLocal();
      if(prev){
        pct=(live.price-prev.close)/prev.close*100;
      }
      last={...last, close:live.price, _live:true};
      bars[bars.length-1]=last;
    }
    const priceEl=row.querySelector('.p'); const pctEl=row.querySelector('.pct');
    const displayPrice=live?live.price:last.close;
    if(priceEl) priceEl.textContent=displayPrice.toFixed(2);
    if(pctEl){ pctEl.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%'; pctEl.className='pct '+(pct>0?'up':pct<0?'down':'flat'); priceEl.className='p '+(pct>0?'up':pct<0?'down':'flat'); }
    const canvas=row.querySelector('canvas'); if(canvas){ drawMiniK(canvas, bars); }
    row._pct=pct; row._bars=bars;
  }catch(e){ const priceEl=row.querySelector('.p'); if(priceEl) priceEl.textContent='无数据'; const pctEl=row.querySelector('.pct'); if(pctEl) pctEl.textContent=e.message.slice(0,12); row._pct=-999; }
  finally{ setTimeout(()=>row.classList.remove('updating'), 600); }
}
