<!DOCTYPE html>
<html lang="zh-CN">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>盘面 · 正式版 全市场</title>
<style>
  :root{--bg:#0d1117;--panel:#151b23;--line:#232b36;--text:#e6e9ef;--dim:#8891a0;--up:#e5484d;--down:#2ea567;--accent:#4a90e2;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;height:100%;}
  #app{max-width:760px;margin:0 auto;padding:12px 12px 80px;}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 12px;}
  header h1{font-size:18px;font-weight:700;margin:0;}
  #clock{font-size:11px;color:var(--dim);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;position:relative;overflow:hidden;}
  .card.updating::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.04),transparent);animation:shimmer 1.2s infinite;}
  @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
  .idx-row{display:flex;align-items:center;gap:10px;}
  .idx-name{width:66px;flex-shrink:0;}
  .idx-name .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .idx-name .c{font-size:10px;color:var(--dim);}
  .idx-chart{flex:1;height:42px;}
  .idx-price{width:108px;text-align:right;flex-shrink:0;}
  .idx-price .p{font-size:14px;font-weight:600;}
  .idx-price .pct{font-size:11px;margin-top:2px;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--dim);}
  .section-label{font-size:11px;color:var(--dim);margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center;}
  .pill{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--dim);cursor:pointer;}
  .pill.active{color:var(--text);border-color:var(--accent);background:rgba(74,144,226,.12);}
  #detail{position:fixed;inset:0;background:var(--bg);transform:translateY(100%);transition:transform .28s ease;z-index:20;overflow-y:auto;}
  #detail.open{transform:translateY(0);}
  #detail-inner{max-width:760px;margin:0 auto;padding:12px 12px 20px;}
  .detail-head{display:flex;align-items:center;gap:10px;padding:6px 2px 8px;position:sticky;top:0;background:var(--bg);z-index:2;}
  .back{font-size:22px;padding:2px 8px 2px 0;}
  .detail-head .title{font-size:15px;font-weight:600;flex:1;}
  .detail-kv{display:flex;gap:12px;font-size:11px;color:var(--dim);flex-wrap:wrap;margin:4px 0 6px;}
  .detail-kv b{color:var(--text);font-weight:600;}
  canvas.chart{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:block;margin-bottom:6px;}
  canvas.chart.main{height:260px;}
  canvas.chart.zq{height:105px;}
  canvas.chart.intra{height:135px;}
  canvas.chart.vol{height:52px;}
  canvas.chart.macd{height:52px;}
  canvas.chart.mini{height:42px;background:transparent;border:none;}
  .value-tags{display:flex;gap:8px;flex-wrap:wrap;font-size:10px;color:var(--dim);margin:2px 0 6px;}
  .value-tags span{border:1px solid var(--line);border-radius:6px;padding:2px 6px;}
  .hint{font-size:11px;color:var(--dim);text-align:center;padding:10px 0;}
  .cat-bar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;}
  .cat-bar .pill{white-space:nowrap;}
</style>
</head>
<body>
<div id="app">
  <header><h1>盘面 · 正式版 全市场 150天</h1><div id="clock">--:--:--</div></header>
  <div id="data-status" style="font-size:10px;color:var(--dim);margin:-8px 2px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;">
    <span id="data-status-text">检查中…</span>
    <span style="display:flex;gap:6px;align-items:center;">
      <span id="src-toggle" class="pill active" style="padding:2px 8px;">东财</span>
      <span id="data-status-refresh" class="pill" style="padding:2px 8px;">Actions</span>
    </span>
  </div>
  <div class="section-label"><span>指数 · 后台150天+当日实时K</span><span style="font-size:10px;">点进看分时+K+VOL+MACD</span></div>
  <div id="idx-list"></div>
  <div class="section-label"><span>自选股 <span id="wl-count"></span></span><span id="edit-toggle" class="pill">编辑</span></div>
  <div class="cat-bar" id="cat-bar"></div>
  <div id="watch-list"></div>
  <div id="detail">
    <div id="detail-inner">
      <div class="detail-head"><div class="back" id="detail-back">‹</div><div class="title" id="detail-title">--</div><div id="detail-src" class="pill">东财</div></div>
      <div id="detail-meta" class="hint" style="text-align:left;"></div>
      <div id="detail-price" class="detail-kv"></div>
      <div id="detail-cost" class="value-tags"></div>
      <canvas id="chart-main" class="chart main"></canvas>
      <canvas id="chart-sub" class="chart zq"></canvas>
      <canvas id="chart-intra" class="chart intra"></canvas>
      <canvas id="chart-vol" class="chart vol"></canvas>
      <canvas id="chart-macd" class="chart macd"></canvas>
      <div id="detail-zq" class="value-tags"></div>
      <div class="hint" id="detail-hint">点击K线显示光标</div>
    </div>
  </div>
</div>
<script>
const DATA_REPO='itssteepturn-lgtm/stock-data-test';
const DATA_BRANCH='main';
const TEST_INDEXES=[
  {code:'1.000001',name:'上证指数',short:'000001',type:'index'},
  {code:'0.399001',name:'深证成指',short:'399001',type:'index'},
  {code:'0.399006',name:'创业板指',short:'399006',type:'index'},
  {code:'1.000688',name:'科创50',short:'000688',type:'index'},
];
const BACKEND_ONLY_TEST = true; // 第5点：只测后台，东财/腾讯功能保留但切断 // 第5点：只测后台，东财/腾讯功能保留但切断
let SRC='east';
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString();},1000);
function codeToSecid(code){
  if(/^(6|9)/.test(code)) return '1.'+code;
  if(/^(0|2|3)/.test(code)) return '0.'+code;
  if(/^(4|8)/.test(code)) return '0.'+code;
  return null;
}
function todayStrLocal(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function buildStockUrls(code){
  const t=Date.now();
  return [`./data/stocks/${code}.json?t=${t}`,`https://cdn.jsdelivr.net/gh/${DATA_REPO}@${DATA_BRANCH}/data/stocks/${code}.json?t=${t}`,`https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/data/stocks/${code}.json?t=${t}`];
}
function buildIndexUrls(code){
  const t=Date.now();
  return [`./data/indices/${code}.json?t=${t}`,`https://cdn.jsdelivr.net/gh/${DATA_REPO}@${DATA_BRANCH}/data/indices/${code}.json?t=${t}`,`https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/data/indices/${code}.json?t=${t}`];
}
function buildMetaUrls(){const t=Date.now();return [`./data/meta.json?t=${t}`,`https://cdn.jsdelivr.net/gh/${DATA_REPO}@${DATA_BRANCH}/data/meta.json?t=${t}`,`https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/data/meta.json?t=${t}`];}
function buildCalendarUrls(){const t=Date.now();return [`./data/trading_calendar.json?t=${t}`,`https://cdn.jsdelivr.net/gh/${DATA_REPO}@${DATA_BRANCH}/data/trading_calendar.json?t=${t}`,`https://raw.githubusercontent.com/${DATA_REPO}/${DATA_BRANCH}/data/trading_calendar.json?t=${t}`];}
let TRADING_CALENDAR=[];
async function fetchJsonWithFallback(urls, timeoutMs=3500){
  const ctrls=urls.map(()=>new AbortController());
  const ps=urls.map((url,i)=>{
    const ctrl=ctrls[i];const tm=setTimeout(()=>ctrl.abort(),timeoutMs);
    return fetch(url,{cache:'no-store',signal:ctrl.signal}).then(async r=>{
      clearTimeout(tm);if(!r.ok) throw new Error('http '+r.status);const j=await r.json();
      ctrls.forEach((c,idx)=>{ if(idx!==i) try{c.abort();}catch(e){} });return j;
    }).catch(e=>{ clearTimeout(tm); throw e; });
  });
  if(Promise.any) return await Promise.any(ps);
  return await new Promise((res,rej)=>{let f=0,last=null;ps.forEach(p=>p.then(res).catch(e=>{f++;last=e;if(f===ps.length) rej(last);}));});
}
async function loadTradingCalendar(){
  try{
    const cal=await fetchJsonWithFallback(buildCalendarUrls(),3500);
    if(Array.isArray(cal) && cal.length>=20){TRADING_CALENDAR=cal.slice(-200);return TRADING_CALENDAR;}
  }catch(e){}
  return [];
}
function getLatestNTradingDates(n){if(TRADING_CALENDAR && TRADING_CALENDAR.length>=n) return TRADING_CALENDAR.slice(-n);return null;}

async function getFullHistory(secid, limit=150){
  const code=secid.split('.')[1];
  const isIndex=TEST_INDEXES.some(x=>x.code===secid);
  const urls=isIndex?buildIndexUrls(code):buildStockUrls(code);
  const j=await fetchJsonWithFallback(urls,3500);
  const raw=j.bars||j;
  if(!raw||raw.length<1) throw new Error('后台无 '+code);
  const bars=Array.isArray(raw)?raw:(raw.bars||[]);
  return bars.slice(-Math.min(limit,150)).map(b=>({
    date:b.date,open:b.open,close:b.close,high:b.high,low:b.low,vol:b.vol||0,amount:b.amount||0,turnover:b.turnover||0,
    avg:b.avg||(b.amount&&b.vol?b.amount/(b.vol*100):b.close),
    cost50:b.cost50,cost75:b.cost75,cost90:b.cost90,zq1:b.zq1,zq:b.zq,vwma10:b.vwma10,_pre:true
  }));
}
const histCache={};
async function getHistBars(secid, limit){
  if(histCache[secid]) return JSON.parse(JSON.stringify(histCache[secid])).slice(-Math.min(limit,150));
  const bars=await getFullHistory(secid, limit);
  histCache[secid]=bars;
  return JSON.parse(JSON.stringify(bars)).slice(-Math.min(limit,150));
}
async function getLiveQuoteFull(secid){
  if(BACKEND_ONLY_TEST) return null;
  try{
    const isIndex=TEST_INDEXES.some(x=>x.code===secid);
    const url=`https://push2.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f43,f44,f45,f46,f47,f48,f57,f58,f60,f19,f20,f18,f170`;
    const res=await fetch(url,{cache:'no-store'});const data=await res.json();const d=data?.data; if(!d||!d.f43) throw new Error('no data');
    let preClose=d.f60?d.f60/100:null;
    if(isIndex && preClose && Math.abs(preClose - d.f43/100)/ (d.f43/100) > 0.3) preClose=null;
    let pct=0;if(d.f43&&preClose) pct=(d.f43-preClose)/preClose*100; else if(d.f170) pct=d.f170/100;
    return {price:d.f43/100, open:d.f46/100, high:d.f44/100, low:d.f45/100, vol:d.f47, amount:d.f48, preClose:preClose, pct:pct};
  }catch(e){ return null; }
}
async function getIntraday(secid){
  if(BACKEND_ONLY_TEST) return [];
  try{
    const url=`https://push2.eastmoney.com/api/qt/stock/trends2/get?secid=${secid}&fields1=f1,f2,f3,f4,f5,f6,f7,f8&fields2=f51,f52,f53,f54&iscr=0&iscca=0`;
    const res=await fetch(url,{cache:'no-store'}); const data=await res.json();
    const trends=data?.data?.trends; if(!trends) return [];
    return trends.map(t=>{ const a=t.split(','); return {time:a[0].slice(11,16),price:+a[1], avg:+a[2]}; });
  }catch(e){ return []; }
}
function calcMACD(closes){
  const ema=(arr,period)=>{const k=2/(period+1); let e=[]; let prev=arr[0]; for(let i=0;i<arr.length;i++){ const v=arr[i]; prev=i===0?v:v*k+prev*(1-k); e.push(prev);} return e;};
  const ema12=ema(closes,12), ema26=ema(closes,26);
  const dif=closes.map((_,i)=>ema12[i]-ema26[i]);
  const dea=ema(dif,9);
  const macd=dif.map((d,i)=>(d-dea[i])*2);
  return {dif,dea,macd};
}
const COST_COLORS={50:'#2ea567',75:'#e0b23c',90:'#e5484d'};
function drawMain(canvas, bars, costLines, highlightIdx, isIndex=false){
  const dpr=window.devicePixelRatio||1; const w=canvas.clientWidth,h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!bars||!bars.length) return; const valid=bars.filter(b=>b); if(!valid.length) return;
  const highs=valid.map(b=>b.high), lows=valid.map(b=>b.low);
  let minL=Math.min(...lows), maxH=Math.max(...highs); let pad=(maxH-minL)*0.08||1; let minY=minL-pad, maxY=maxH+pad; let range=maxY-minY||1;
  const y=v=>h-((v-minY)/range)*h; const n=bars.length; const plotW=w-10; const x=i=> (n===1?plotW/2 : i/(n-1)*plotW); const bw=Math.max(2, plotW/n*0.6);
  if(!isIndex && costLines){
    const order=[50,75,90];
    costLines.forEach((line,li)=>{
      if(!line) return; const key=order[li]; ctx.strokeStyle=COST_COLORS[key]||'#888'; ctx.lineWidth=1; ctx.beginPath(); let st=false;
      line.forEach((v,i)=>{ if(v==null || bars[i]==null){st=false;return;} const xx=x(i); if(!st){ctx.moveTo(xx,y(v));st=true;} else ctx.lineTo(xx,y(v));}); ctx.stroke();
    });
  }
  bars.forEach((b,i)=>{ if(!b) return; const xx=x(i); const oY=y(b.open), cY=y(b.close), hY=y(b.high), lY=y(b.low); const up=b.close>=b.open; ctx.strokeStyle=up?'#e5484d':'#2ea567'; ctx.fillStyle=up?'#e5484d':'#2ea567'; ctx.beginPath(); ctx.moveTo(xx,hY); ctx.lineTo(xx,lY); ctx.stroke(); const bodyH=Math.max(1, Math.abs(cY-oY)); ctx.fillRect(xx-bw/2, Math.min(oY,cY), bw, bodyH||1); });
  if(highlightIdx!=null){ const xx=x(highlightIdx); ctx.strokeStyle='#e6e9ef'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,h); ctx.stroke(); ctx.setLineDash([]); }
}
function drawMiniK(canvas, bars){
  const dpr=window.devicePixelRatio||1; const cssW=canvas.clientWidth||80, cssH=canvas.clientHeight||42; canvas.width=cssW*dpr; canvas.height=cssH*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,cssW,cssH);
  if(!bars||bars.length<2) return; const valid=bars.filter(b=>b); if(!valid.length) return;
  const highs=valid.map(b=>b.high), lows=valid.map(b=>b.low); let minL=Math.min(...lows), maxH=Math.max(...highs); let range=maxH-minL||1; const pad=range*0.08; minL-=pad; maxH+=pad; range=maxH-minL; const y=v=>cssH-((v-minL)/range)*cssH;
  const n=bars.length; const plotW=cssW-2; const x=i=> i/(n-1)*plotW; const bw=Math.max(1, plotW/n*0.55);
  bars.forEach((b,i)=>{ if(!b) return; const xx=x(i); const oY=y(b.open), cY=y(b.close), hY=y(b.high), lY=y(b.low); const up=b.close>=b.open; ctx.strokeStyle=up?'#e5484d':'#2ea567'; ctx.fillStyle=up?'#e5484d':'#2ea567'; ctx.beginPath(); ctx.moveTo(xx,hY); ctx.lineTo(xx,lY); ctx.stroke(); const bodyH=Math.max(1, Math.abs(cY-oY)); ctx.fillRect(xx-bw/2, Math.min(oY,cY), bw, bodyH||1); });
  const missing=bars.filter(b=>!b).length; if(missing>0){ ctx.fillStyle='#e5484d'; ctx.beginPath(); ctx.arc(cssW-4,6,3,0,Math.PI*2); ctx.fill(); }
}
function drawVOL(canvas, bars, highlightIdx){
  const dpr=window.devicePixelRatio||1; const w=canvas.clientWidth,h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!bars||!bars.length) return; const valid=bars.filter(b=>b); if(!valid.length) return; const maxV=Math.max(...valid.map(b=>b.vol||0))*1.2||1; const y=v=>h-(v/maxV)*h; const n=bars.length; const plotW=w-10; const x=i=> i/(n-1)*plotW; const bw=Math.max(1, plotW/n*0.6);
  bars.forEach((b,i)=>{ if(!b) return; const xx=x(i); const yy=y(b.vol||0); const up=b.close>=b.open; ctx.fillStyle=up?'#e5484d':'#2ea567'; ctx.fillRect(xx-bw/2, yy, bw, h-yy); });
  if(highlightIdx!=null){ const xx=x(highlightIdx); ctx.strokeStyle='#e6e9ef'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,h); ctx.stroke(); ctx.setLineDash([]); }
}
function drawZQ(canvas, zq1,zq, highlightIdx){
  const dpr=window.devicePixelRatio||1; const w=canvas.clientWidth,h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!zq1||!zq1.length) return; const y=v=>h-(v/100)*h; const n=zq1.length; const plotW=w-10; const x=i=> i/(n-1)*plotW;
  [[100,'#3a4250'],[50,'#e5484d'],[0,'#3a4250']].forEach(([v,c])=>{ ctx.strokeStyle=c; ctx.setLineDash(v===50?[]:[3,3]); ctx.beginPath(); ctx.moveTo(0,y(v)); ctx.lineTo(plotW,y(v)); ctx.stroke();}); ctx.setLineDash([]);
  [[zq1,'#4a90e2'],[zq,'#c46be0']].forEach(([s,c])=>{ if(!s) return; ctx.strokeStyle=c; ctx.lineWidth=1.2; ctx.beginPath(); let st=false; s.forEach((v,i)=>{ if(v==null) return; const xx=x(i); if(!st){ctx.moveTo(xx,y(v));st=true;} else ctx.lineTo(xx,y(v));}); ctx.stroke();});
  if(highlightIdx!=null){ const xx=x(highlightIdx); ctx.strokeStyle='#e6e9ef'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,h); ctx.stroke(); ctx.setLineDash([]); }
}
function drawMACD(canvas, dif,dea,macd, highlightIdx){
  const dpr=window.devicePixelRatio||1; const w=canvas.clientWidth,h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!dif||!dif.length) return; const validVals=[...dif,...dea,...macd].filter(v=>v!=null); if(!validVals.length) return; const max=Math.max(...validVals), min=Math.min(...validVals); const range=(max-min)||1; const y=v=>h-((v-min)/range)*h;
  const y0=y(0); ctx.strokeStyle='#3a4250'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(w-10,y0); ctx.stroke(); ctx.setLineDash([]);
  const n=dif.length; const plotW=w-10; const x=i=> i/(n-1)*plotW;
  for(let i=0;i<n;i++){ const v=macd[i]; if(v==null) continue; const xx=x(i); const yy=y(v); ctx.fillStyle=v>=0?'#e5484d':'#2ea567'; ctx.fillRect(xx-1, Math.min(yy,y0), 2, Math.abs(yy-y0)); }
  [[dif,'#4a90e2'],[dea,'#e0b23c']].forEach(([s,c])=>{ ctx.strokeStyle=c; ctx.lineWidth=1.1; ctx.beginPath(); let st=false; s.forEach((v,i)=>{ if(v==null) return; const xx=x(i); if(!st){ctx.moveTo(xx,y(v));st=true;} else ctx.lineTo(xx,y(v));}); ctx.stroke();});
  if(highlightIdx!=null){ const xx=x(highlightIdx); ctx.strokeStyle='#e6e9ef'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(xx,0); ctx.lineTo(xx,h); ctx.stroke(); ctx.setLineDash([]); }
}
function getLimitPct(secid){ const code=secid.split('.')[1]; if(code.startsWith('30')||code.startsWith('688')) return 20; if(code.startsWith('8')||code.startsWith('4')) return 30; return 10; }
function drawIntra(canvas, trends, prevClose, secid){
  const dpr=window.devicePixelRatio||1; const w=canvas.clientWidth,h=canvas.clientHeight; canvas.width=w*dpr; canvas.height=h*dpr; const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr); ctx.clearRect(0,0,w,h);
  if(!trends||!trends.length) { ctx.fillStyle='#8891a0'; ctx.font='11px sans-serif'; ctx.fillText('无分时', w/2-20, h/2); return; }
  const prices=trends.map(t=>t.price); const base=prevClose||prices[0]; const limitPct=getLimitPct(secid); const max=base*(1+limitPct/100); const min=base*(1-limitPct/100); const range=max-min; const y=v=>h-((v-min)/range)*h; const TOTAL_MIN=242; const curCount=trends.length; const y0=y(base);
  ctx.strokeStyle='#3a4250'; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(w,y0); ctx.stroke(); ctx.setLineDash([]);

async function fillRowQuote(item, row, isUpdating=false){

  try{
    const barsRaw=await getHistBars(item.code,60);
    if(!barsRaw.length) throw new Error('no bars');
    let calendar20=getLatestNTradingDates(20);
    let bars=barsRaw.slice(-20); let aligned=null; let missingInfo='';
    if(calendar20){
      const byDate={}; barsRaw.forEach(b=>byDate[b.date]=b);
      aligned=calendar20.map(d=>byDate[d]||null);
      const miss=aligned.filter(x=>!x).length;
      if(miss>0){
        const lastDate=barsRaw[barsRaw.length-1].date; const latest=calendar20[calendar20.length-1];
        if(lastDate!==latest) missingInfo=`缺 ${latest}`; else missingInfo=`停牌${miss}天`;
        bars=aligned;
      }else{ bars=aligned; }
    }
    const barsForCalc=barsRaw;
    let last=barsForCalc[barsForCalc.length-1]; let prev=barsForCalc.length>=2?barsForCalc[barsForCalc.length-2]:null;
    const live=await getLiveQuoteFull(item.code);

    const displayPrice=live?live.price:last.close;
    if(priceEl) priceEl.textContent=displayPrice.toFixed(2);
    if(pctEl){
      if(missingInfo){ pctEl.textContent=missingInfo; pctEl.className='pct up'; priceEl.className='p up'; row.style.border='1px dashed #e5484d'; row.title='后台缺数据: '+missingInfo+' 最后: '+last.date; }
      else { pctEl.textContent=(pct>=0?'+':'')+pct.toFixed(2)+'%'; pctEl.className='pct '+(pct>0?'up':pct<0?'down':'flat'); priceEl.className='p '+(pct>0?'up':pct<0?'down':'flat'); row.style.border=''; row.title=''; }
    }
