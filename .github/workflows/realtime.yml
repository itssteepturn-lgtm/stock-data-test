name: realtime

# 盘中实时：北京 9:30-11:30 13:00-15:00 = UTC 1:30-3:30 5:00-7:00
# 北京9:30-11:30 13:00-15:00 = UTC 1:30-3:30 5:00-7:00，每5分钟，稳
on:
  schedule:
    - cron: '*/5 1-3,5-7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'fast=29只自选+指数 full=全市场'
        required: false
        default: 'fast'
        type: choice
        options:
          - 'fast'
          - 'full'

concurrency:
  group: realtime
  cancel-in-progress: true

jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests
      - name: Decide mode
        id: decide
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            MIN=$(date -u +%M)
            if [ $((10#$MIN % 5)) -eq 0 ]; then
              MODE="full"
            else
              MODE="fast"
            fi
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Decided mode $MODE minute $(date -u +%M)"
      - name: Run realtime
        run: |
          echo "Running mode ${{ steps.decide.outputs.mode }}"
          python scripts/fetch_realtime.py --mode ${{ steps.decide.outputs.mode }}
      - name: Commit realtime
        run: |
          git config user.name "realtime-bot"
          git config user.email "bot@test.com"
          git add data/realtime/ data/chip_state/ || true
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "realtime ${{ steps.decide.outputs.mode }} $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push) || echo "push fail, will retry next minute"
