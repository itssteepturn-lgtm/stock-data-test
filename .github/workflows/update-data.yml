name: update-data

# 全自动：每个工作日北京时间 18:30 抓一次，21:30 再补跑一次（baostock 偶尔晚更新）。
# 休市日、或第二次补跑时数据已是最新，会自动发现「没有变化」而不发布。
on:
  schedule:
    - cron: '30 10 * * 1-5'
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal=日常增量(自动处理除权)  rebuild=全部整只重抓'
        required: false
        default: 'normal'
        type: choice
        options:
          - 'normal'
          - 'rebuild'

concurrency:
  group: site-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install baostock

      - name: Keepalive (防止 60 天无活动后定时任务被 GitHub 自动停用)
        run: |
          cd code
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((40*86400)) ]; then
            git config user.name "data-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit --allow-empty -q -m "keepalive"
            git push -q || echo "keepalive push failed"
          fi

      - name: Load previous data (gh-pages)
        run: bash code/scripts/site.sh prepare

      - name: Fetch daily bars (baostock)
        timeout-minutes: 335
        working-directory: site
        run: |
          MODE="${{ github.event.inputs.mode || 'normal' }}"
          REBUILD=false
          if [ "$MODE" = "rebuild" ]; then REBUILD=true; fi
          python ../code/scripts/fetch-daily.py --rebuild $REBUILD --max-minutes 320

      - name: Build screening shards
        if: always()
        working-directory: site
        run: |
          if [ -d data/stocks ]; then python ../code/scripts/build-screen.py; fi

      - name: Publish (single commit, history never grows)
        if: always()
        run: bash code/scripts/site.sh publish
