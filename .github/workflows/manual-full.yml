name: manual-full-market-once
on:
  workflow_dispatch:
    inputs:
      resume:
        description: '是否断点续跑 true=续跑 false=全清理重跑'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      batch_commit:
        description: '每多少只提交一次 1000推荐'
        required: false
        default: '1000'
        type: choice
        options:
          - '500'
          - '1000'
          - '2000'

concurrency:
  group: manual-full-market-once
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install baostock
      - name: Run full market (manual, checkpoint resume, batch push)
        run: |
          RESUME="${{ github.event.inputs.resume || 'true' }}"
          BATCH="${{ github.event.inputs.batch_commit || '1000' }}"
          echo "Repo: itssteepturn-lgtm/stock-data-test manual run resume=$RESUME batch=$BATCH"
          echo "指数只抓取数据，不参与cost/zq计算"
          echo "卡顿就过，断点续存，每${BATCH}只提交一次"
          python scripts/fetch-daily.py --resume $RESUME --batch-commit $BATCH
      - name: Final push remaining
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "bot@test.com"
          git add data/
          git diff --cached --quiet || git commit -m "manual final remaining $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push) || echo "final push failed, please re-run with resume=true"
