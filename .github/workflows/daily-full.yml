name: daily-full-market-once
on:
  schedule:
    # 北京 01:00 跑一次，一次性全市场，不再分45分钟多次
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      resume:
        description: '是否断点续跑 true=续跑查缺补漏 false=全清理重跑'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: fetch-full-market-once
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install baostock
      - name: Run full market ONCE (all codes in one run)
        run: |
          RESUME="${{ github.event.inputs.resume || 'true' }}"
          python scripts/fetch-daily.py --resume $RESUME
      - name: Commit all data once
        run: |
          git config user.name "data-bot"
          git config user.email "bot@test.com"
          git add data/
          git diff --cached --quiet || git commit -m "full market once $(date -u +%Y-%m-%dT%H:%M:%SZ) $(cat data/meta.json | python3 -c 'import json,sys;print(json.load(sys.stdin).get("note",""))')"
          git push
